<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRAXUP Imobiliário</title><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Crect%20width%3D%2248%22%20height%3D%2248%22%20rx%3D%2210%22%20fill%3D%22%230A2463%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2226%22%20width%3D%227%22%20height%3D%2214%22%20rx%3D%222%22%20fill%3D%22%232F6BF0%22%2F%3E%3Crect%20x%3D%2219%22%20y%3D%2220%22%20width%3D%227%22%20height%3D%2220%22%20rx%3D%222%22%20fill%3D%22%232F6BF0%22%2F%3E%3Crect%20x%3D%2230%22%20y%3D%2213%22%20width%3D%227%22%20height%3D%2227%22%20rx%3D%222%22%20fill%3D%22%232F6BF0%22%2F%3E%3Cpath%20d%3D%22M6%2036%2017%2028l6%204%2014-14%22%20stroke%3D%22%23FF9F1C%22%20stroke-width%3D%224%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style id="appStyles">:root{
  --navy:#0A2463;--navy-2:#0E2F80;--blue:#1246B2;--blue-2:#1E5AD8;--blue-3:#E8EFFD;
  --orange:#FF9F1C;--orange-2:#FFB938;--orange-3:#FFF4E2;
  --bg:#F3F6FC;--card:#FFFFFF;--line:#DCE3F0;--text:#14213D;--muted:#5D6B86;
  --ok:#1F9D6B;--ok-3:#E3F6EE;--warn:#D98E04;--warn-3:#FFF3D6;--bad:#D64545;--bad-3:#FDE8E8;--gray:#9AA5B8;
  --radius:12px;--title:'Montserrat','Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--shadow:0 1px 2px rgba(10,36,99,.06),0 6px 18px rgba(10,36,99,.06);
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);font-size:15px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
h1,h2,h3,.brandText,.kpi strong{font-family:var(--title)}
h1{font-size:24px;margin:0;letter-spacing:-.4px}
h2{font-size:17px;margin:0}
h3{font-size:15px;margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;min-width:0;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-2);outline-offset:0;border-color:transparent}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--text)}
label.check input{width:auto}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
button:hover{background:var(--blue-3)}
button:disabled{opacity:.55;cursor:not-allowed}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button.primary:hover{background:var(--blue-2)}
button.accent{background:var(--orange);color:#1b1300;border-color:var(--orange);font-weight:600}
button.accent:hover{background:var(--orange-2)}
button.danger{color:var(--bad);border-color:#f2c4c4}
button.danger:hover{background:var(--bad-3)}
button.ghost{border-color:transparent;background:transparent}
button.sm{padding:5px 9px;font-size:13px}
.icon{width:18px;height:18px;flex:none}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:linear-gradient(135deg,#0B3AA8 0%,#1246B2 45%,#0A2463 100%)}
.loginArt{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;color:#fff;text-align:center;gap:22px}
.loginArt img{width:min(380px,80%);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.loginArt p{max-width:420px;color:#cfdcff;line-height:1.6;margin:0}
.loginPanel{display:flex;align-items:center;justify-content:center;padding:30px}
.loginCard{background:#fff;border-radius:18px;padding:34px;width:min(440px,100%);box-shadow:0 30px 80px rgba(5,20,70,.4);display:grid;gap:16px}
.loginCard h1{font-size:22px}
.loginCard .sub{color:var(--muted);font-size:14px;margin-top:-8px}
.loginCard button.primary{justify-content:center;padding:12px}
.storageNote{font-size:12px;color:var(--muted);background:var(--bg);border-radius:9px;padding:9px 11px;line-height:1.5}

/* shell */
.shell{display:flex;min-height:100vh}
aside{width:248px;background:linear-gradient(180deg,var(--navy) 0%,#071B4D 100%);color:#fff;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:20px 12px;overflow-y:auto;z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand svg{width:40px;height:40px}
.brandText{font-weight:900;font-size:23px;letter-spacing:.5px;line-height:1}
.brandText b{color:var(--orange);font-weight:900}
.brandSub{font-size:9.5px;letter-spacing:2.2px;color:#9fb6ee;margin-top:4px;font-weight:600}
.brandLine{height:3px;margin:0 10px 16px;border-radius:3px;background:linear-gradient(90deg,var(--blue-2) 0 48%,transparent 48% 52%,var(--orange) 52%)}
nav{display:grid;gap:2px}
.navGroup{font-size:10.5px;letter-spacing:1.6px;color:#7f97d0;margin:14px 12px 6px;font-weight:700}
nav button{background:transparent;border:0;color:#c9d6f6;justify-content:flex-start;padding:9px 12px;border-radius:9px;font-size:14px;width:100%}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.active{background:var(--blue);color:#fff;box-shadow:inset 3px 0 0 var(--orange)}
.asideFoot{margin-top:auto;padding:14px 12px 0;font-size:11.5px;color:#7f97d0;line-height:1.6}
main{margin-left:248px;width:calc(100% - 248px);min-width:0}
.topbar{position:sticky;top:0;z-index:4;background:rgba(243,246,252,.92);backdrop-filter:blur(6px);display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--line)}
.topbar .title{flex:1;min-width:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--blue);text-transform:uppercase}
.filialPick{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 12px;font-size:13px;color:var(--muted)}
.filialPick select{border:0;padding:6px 8px;width:auto;font-weight:600;color:var(--text)}
.userChip{display:flex;align-items:center;gap:9px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--orange);color:#1b1300;display:grid;place-items:center;font-weight:800;font-family:var(--title)}
.content{padding:24px 28px 60px}
.menuToggle{display:none}

/* cards */
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi span{font-size:13px;color:var(--muted);display:block}
.kpi strong{display:block;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:9px 0 4px;letter-spacing:-.4px}
.kpi small{color:var(--muted);font-size:12px}
.kpi.hl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange)}
.kpi.bl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;min-width:0}
.cardHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cardHead p{margin:3px 0 0;color:var(--muted);font-size:13px}
.cardBody{padding:16px 18px}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.toolbar label{min-width:150px}
.toolbar .grow{flex:1;min-width:200px}
.spacer{flex:1}
.red{color:var(--bad)!important}.green{color:var(--ok)!important}.orange{color:var(--warn)!important}.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.notice{border-radius:10px;padding:11px 14px;font-size:13.5px;line-height:1.5;margin-bottom:14px;border:1px solid}
.notice.info{background:var(--blue-3);border-color:#c8d7fa;color:#14306f}
.notice.warn{background:var(--warn-3);border-color:#f3d998;color:#6b4700}
.notice.bad{background:var(--bad-3);border-color:#f2c4c4;color:#7c1f1f}
.notice.ok{background:var(--ok-3);border-color:#bfe8d5;color:#0f5a3c}

/* tables */
.tableWrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;background:#F7F9FD;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #EDF1F8;vertical-align:middle}
td small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
tr:hover td{background:#FAFBFF}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.actions{white-space:nowrap;text-align:right}
td.actions button{margin-left:4px}
tfoot td{font-weight:700;background:#F7F9FD}
.empty{padding:34px;text-align:center;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#EEF1F7;color:#4A5875;white-space:nowrap}
.badge.ok{background:var(--ok-3);color:var(--ok)}
.badge.warn{background:var(--warn-3);color:var(--warn)}
.badge.bad{background:var(--bad-3);color:var(--bad)}
.badge.blue{background:var(--blue-3);color:var(--blue)}
.badge.orange{background:var(--orange-3);color:#B86A00}
.pill{display:inline-block;width:9px;height:9px;border-radius:50%}

/* forms */
.formGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.formGrid .c2{grid-column:span 2}.formGrid .c3{grid-column:span 3}.formGrid .c4{grid-column:1/-1}
.formSection{font-family:var(--title);font-weight:700;font-size:13px;color:var(--blue);grid-column:1/-1;margin-top:6px;padding-top:10px;border-top:1px dashed var(--line)}
.formSection:first-child{border-top:0;padding-top:0;margin-top:0}
.formActions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(7,20,58,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50}
.modal{background:#fff;border-radius:16px;width:min(760px,100%);box-shadow:0 30px 80px rgba(0,0,0,.3);position:relative}
.modal.wide{width:min(1080px,100%)}
.modal.narrow{width:min(480px,100%)}
.modalHead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.modalHead .eyebrow{margin-bottom:4px}
.modalBody{padding:18px 22px 22px}
.toastBox{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:80}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:14px;max-width:380px;border-left:4px solid var(--orange)}
.toast.bad{border-left-color:var(--bad)}

/* barra de empresas (painel) — identidade TRAXUP */
.empBar{display:inline-flex;flex-wrap:wrap;gap:12px;background:linear-gradient(135deg,var(--navy) 0%,#071B4D 100%);border-radius:14px;padding:12px;margin-bottom:20px;max-width:100%;box-shadow:var(--shadow);position:relative}
.empBar::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--blue-2) 0 48%,transparent 48% 52%,var(--orange) 52%)}
.empBar button{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.16);color:#DCE6FF;border-radius:11px;padding:13px 22px;font-size:16px;font-weight:800;font-family:var(--title);gap:12px;letter-spacing:.2px}
.empBar button:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.empBar button .icon{width:19px;height:19px;color:#8FA8E0}
.empBar button.on{background:linear-gradient(180deg,var(--blue-2),var(--blue));border-color:var(--orange);color:#fff;box-shadow:0 6px 16px rgba(18,70,178,.45),inset 0 -3px 0 var(--orange)}
.empBar button.on .icon{color:var(--orange-2)}
@media (max-width:820px){.empBar{display:flex}.empBar button{flex:1 1 40%;justify-content:center;padding:11px 14px;font-size:15px}}
/* gráficos do painel */
.vchart{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.vAxis{display:flex;flex-direction:column;justify-content:space-between;font-size:11.5px;color:var(--muted);text-align:right;margin:-7px 0;font-variant-numeric:tabular-nums}
.vPlot{position:relative;border-bottom:1px solid var(--line)}
.vGrid{position:absolute;left:0;right:0;border-top:1px dashed #E3E9F4}
.vBars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,1fr);gap:10px;align-items:end;padding:0 4px}
.vBar{height:100%;border:0;background:transparent;padding:0;display:flex;align-items:flex-end;justify-content:center;border-radius:0}
.vBar:hover{background:rgba(30,90,216,.05)}
.vBar i{display:block;width:100%;max-width:46px;border-radius:7px 7px 0 0;background:linear-gradient(180deg,var(--blue-2),var(--blue));transition:filter .15s}
.vBar:hover i{filter:brightness(1.12)}
.vBar.now i{background:linear-gradient(180deg,#5C8BFF,var(--blue-2))}
.vBar.on i{background:linear-gradient(180deg,var(--orange-2),var(--orange));box-shadow:0 4px 14px rgba(255,159,28,.35)}
.vLabels{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;padding:6px 4px 0;font-size:12.5px;color:var(--muted);text-align:center}
.vLabels .on{color:#B86A00;font-weight:700}
.mesBox{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:linear-gradient(180deg,#F7F9FE,#fff);border-left:4px solid var(--orange)}
.mesBox h3{font-size:16px;margin-bottom:12px}
.mesGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:0;margin-bottom:8px}
.mesGrid div{padding:4px 14px;border-left:1px solid var(--line)}.mesGrid div:first-child{border-left:0;padding-left:0}
.mesGrid span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.mesGrid b{font-family:var(--title);font-size:17px;white-space:nowrap}
.mesGrid div:first-child b{color:var(--ok)}
.donutWrap{display:flex;justify-content:center;padding:6px 0}
.donut{width:min(250px,100%);height:auto}
.dPct{font-family:var(--title);font-weight:900;font-size:34px;fill:var(--navy)}
.dLbl{font-size:13px;fill:var(--muted)}
@media (max-width:820px){.vBars,.vLabels{gap:4px}.vLabels{font-size:10.5px}.mesGrid div{border-left:0;padding-left:0}}
.resTable td,.resTable th{white-space:nowrap}
.comGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.comEmp{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff}
.comEmp h3{font-size:15px;margin-bottom:8px}
.comNums{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px 12px;margin-bottom:10px}.comNums div{min-width:0}
.comNums span,.comTot span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.comNums b{font-family:var(--title);font-size:clamp(13px,1.05vw,15.5px);white-space:nowrap;display:block}
.cBlue{color:var(--blue)}.cOrange{color:#C77700}
.stackBar{display:flex;height:9px;border-radius:9px;overflow:hidden;background:#EDF1F8}.stackBar i{display:block;height:100%}
.comTot{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px;padding:14px;border-radius:10px;background:#F7F9FE;border:1px solid var(--line)}
.comTot b{font-family:var(--title);font-size:17px;white-space:nowrap}
/* charts */
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;padding:10px 4px 0}
.barCol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;height:100%;justify-content:flex-end}
.barStack{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden;min-height:2px}
.barStack i{display:block}
.barCol small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.meter{height:8px;background:#EDF1F8;border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-2))}
.list{display:grid}
.listRow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #EDF1F8;font-size:13.5px}
.listRow:last-child{border-bottom:0}

/* mapa */
.mapLayout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.quadra{margin-bottom:18px}
.quadra h3{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:14px}
.lotGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:7px}
.lotTile{border-radius:8px;padding:8px 6px;text-align:center;color:#fff;font-weight:700;font-size:13px;border:2px solid transparent;cursor:pointer;line-height:1.2;font-family:var(--title)}
.lotTile small{display:block;font-weight:500;font-size:10px;opacity:.9;font-family:inherit}
.lotTile.sel{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,159,28,.35)}
.st-Disponível{background:var(--ok)}.st-Reservado{background:#E8A317}.st-Vendido{background:var(--blue)}.st-Bloqueado{background:var(--gray)}
.planta{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#EEF2FA;user-select:none}
.planta img{display:block;width:100%}
.planta.placing{cursor:crosshair}
.pin{position:absolute;transform:translate(-50%,-50%);min-width:26px;height:26px;padding:0 5px;border-radius:13px;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}
.pin.sel{outline:3px solid var(--orange)}
.sidePanel{position:sticky;top:84px}
.detailList{display:grid;gap:8px;font-size:13.5px}
.detailList div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #EDF1F8;padding-bottom:7px}
.detailList span{color:var(--muted)}
.tabs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 12px}
.tabs button.on{background:var(--navy);color:#fff}

/* boleto */
.boletoWrap{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:11px;max-width:760px;margin:0 auto}
.boletoWrap .bTop{display:flex;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:3px;gap:0}
.boletoWrap .bBank{font-weight:bold;font-size:15px;padding:0 10px 0 0;border-right:2px solid #000}
.boletoWrap .bCode{font-weight:bold;font-size:17px;padding:0 10px;border-right:2px solid #000}
.boletoWrap .bLine{font-weight:bold;font-size:14px;padding-left:10px;flex:1;text-align:right;letter-spacing:.5px}
.boletoWrap table{border-collapse:collapse;width:100%;font-size:11px}
.boletoWrap td{border:1px solid #000;padding:2px 5px;vertical-align:top;background:#fff!important}
.boletoWrap td span{display:block;font-size:8.5px;color:#333}
.boletoWrap td b{font-size:11.5px}
.boletoWrap .cut{border-top:1px dashed #000;margin:18px 0 10px;font-size:9px;text-align:right}
.barcodeSvg{display:block;margin-top:6px}

/* contratos */
.varPalette{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow:auto;padding:4px 0}
.varPalette button{font-size:12px;padding:4px 8px;background:var(--orange-3);border-color:#ffd9a0;color:#7a4700}
.docPreview{border:1px solid var(--line);border-radius:10px;padding:34px 40px;background:#fff;font-family:'Times New Roman',Georgia,serif;font-size:14.5px;line-height:1.65;max-height:620px;overflow:auto;white-space:pre-wrap}
.docPreview table{font-family:Arial,sans-serif;font-size:12px;white-space:normal}
.docPreview td,.docPreview th{border:1px solid #bbb;padding:3px 6px}
.discordPreview{background:#313338;color:#dbdee1;border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.45;white-space:pre-wrap;font-family:'gg sans','Noto Sans',Inter,sans-serif;max-height:360px;overflow:auto}
.discordPreview .dName{color:#fff;font-weight:600;margin-bottom:4px}
code.k{background:var(--blue-3);color:var(--blue);padding:1px 6px;border-radius:5px;font-size:12px}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.mapLayout{grid-template-columns:1fr}.formGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.sidePanel{position:static}}
@media (max-width:820px){
  aside{transform:translateX(-100%);transition:transform .2s}
  body.navOpen aside{transform:none}
  main{margin-left:0;width:100%}
  .menuToggle{display:inline-flex}
  .login{grid-template-columns:1fr}.loginArt{padding:30px 20px 0}.loginArt img{width:220px}
  .topbar{padding:12px 14px;flex-wrap:wrap}.topbar .eyebrow{display:none}.topbar h1{font-size:20px}.content{padding:16px 14px 60px}
  .formGrid{grid-template-columns:1fr}.formGrid .c2,.formGrid .c3{grid-column:auto}
}
@media print{aside,.topbar,.noPrint{display:none!important}main{margin:0;width:100%}}

<script>/* TRAXUP Imobiliário — núcleo: utilidades, armazenamento, autenticação, regras financeiras, boleto BB, conciliação */
'use strict';

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const fmtNum = c => (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const brl = c => 'R$ ' + fmtNum(c || 0);
const toCents = v => { v = String(v ?? '').trim().replace(/[R$\s]/g, ''); if (!v) return 0; if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.'); const n = Math.round(parseFloat(v) * 100); return Number.isFinite(n) ? n : 0; };
const centsIn = c => ((c || 0) / 100).toFixed(2).replace('.', ',');
const hoje = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Recife', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const dataBR = s => s ? s.slice(0, 10).split('-').reverse().join('/') : '—';
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const isoUTC = d => d.toISOString().slice(0, 10);
const diasEntre = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
function addMeses(iso, n) { const [y, m, d] = iso.split('-').map(Number); const t = m - 1 + n; const yy = y + Math.floor(t / 12), mm = ((t % 12) + 12) % 12; const last = new Date(Date.UTC(yy, mm + 1, 0)).getUTCDate(); return `${yy}-${String(mm + 1).padStart(2, '0')}-${String(Math.min(d, last)).padStart(2, '0')}`; }
const addDias = (iso, n) => { const d = parseISO(iso); d.setUTCDate(d.getUTCDate() + n); return isoUTC(d); };
const soma = (arr, f = x => x) => arr.reduce((s, x) => s + (f(x) || 0), 0);
const onlyDigits = s => String(s || '').replace(/\D/g, '');
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const dataExtenso = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return `${d} de ${MESES[m - 1]} de ${y}`; };
const fmtCPF = v => { const d = onlyDigits(v); if (d.length === 11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4'); if (d.length === 14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5'); return v || ''; };

/* valor por extenso (reais) */
function extenso(cents) {
  const u = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
  const dz = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
  const ct = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
  const tri = n => { if (n === 100) return 'cem'; const c = Math.floor(n / 100), r = n % 100, p = []; if (c) p.push(ct[c]); if (r) { if (r < 20) p.push(u[r]); else { p.push(dz[Math.floor(r / 10)] + (r % 10 ? ' e ' + u[r % 10] : '')); } } return p.join(' e '); };
  const num = n => {
    if (n === 0) return 'zero';
    const g = [['', ''], ['mil', 'mil'], ['milhão', 'milhões'], ['bilhão', 'bilhões']]; const parts = []; let i = 0, groups = [];
    while (n > 0) { groups.push(n % 1000); n = Math.floor(n / 1000); }
    for (i = groups.length - 1; i >= 0; i--) { const v = groups[i]; if (!v) continue; let t = i === 1 && v === 1 ? 'mil' : tri(v) + (i ? ' ' + (v === 1 ? g[i][0] : g[i][1]) : ''); parts.push({ t, v, i }); }
    return parts.map((p, k) => { if (k === 0) return p.t; const last = k === parts.length - 1; const join = last && (p.i === 0) && (p.v < 100 || p.v % 100 === 0) ? ' e ' : last && p.i === 0 ? ', ' : ', '; return join + p.t; }).join('').replace(/^, /, '');
  };
  cents = Math.round(cents || 0); const r = Math.floor(cents / 100), c = cents % 100; const out = [];
  if (r) { const t = num(r); const de = (r >= 1e6 && r % 1e6 === 0) ? ' de' : ''; out.push(t + de + (r === 1 ? ' real' : ' reais')); }
  if (c) out.push(num(c) + (c === 1 ? ' centavo' : ' centavos'));
  return out.length ? out.join(' e ') : 'zero real';
}

/* ---------- armazenamento (3 modos: servidor próprio, base do artefato, navegador) ---------- */
const COLS = ['filiais', 'usuarios', 'empreendimentos', 'lotes', 'clientes', 'vendas', 'boletos', 'extratos', 'webhooks', 'modelos', 'config', 'plantas', 'logs'];
const Store = {
  mode: 'local', data: {}, db: null, token: null, downloads: null, queue: {},
  async init() {
    const inArtifact = typeof window.claude === 'object' && window.claude && typeof window.claude.use === 'function';
    if (!inArtifact && /^https?:$/.test(location.protocol)) {
      try { const r = await fetch('api/status', { cache: 'no-store' }); if (r.ok) { const j = await r.json(); if (j && j.app === 'traxup-imob') { this.mode = 'server'; this.serverStatus = j; return; } } } catch (e) { /* sem servidor */ }
    }
    if (inArtifact) {
      const timeout = ms => new Promise(r => setTimeout(() => r(null), ms));
      try { this.db = await Promise.race([window.claude.use('db'), timeout(10000)]); } catch (e) { this.db = null; }
      try { this.downloads = await Promise.race([window.claude.use('downloads'), timeout(4000)]); } catch (e) { this.downloads = null; }
      if (this.db) { this.mode = 'db'; return; }
    }
    this.mode = 'local';
  },
  label() { return { server: 'Servidor TRAXUP (seu VPS)', db: 'Base compartilhada do Claude', local: 'Somente neste navegador (demonstração)' }[this.mode]; },
  async loadAll() {
    this.data = {}; COLS.forEach(c => this.data[c] = {});
    if (this.mode === 'server') {
      const r = await fetch('api/data', { headers: this.authH(), cache: 'no-store' }); if (r.status === 401) throw Error('Sessão expirada. Entre novamente.'); if (!r.ok) throw Error('Falha ao carregar dados do servidor.');
      const j = await r.json(); for (const c of COLS) for (const o of (j[c] || [])) this.data[c][o.id] = o; return;
    }
    if (this.mode === 'db') {
      await Promise.all(COLS.map(async c => {
        let last = '';
        for (let page = 0; page < 30; page++) {
          let q = this.db.collection(c).orderBy('id').limit(1000); if (last) q = q.where('id', '>', last);
          const snap = await q.get(); snap.docs.forEach(d => { if (d.exists) this.data[c][d.id] = { ...d.data(), id: d.id }; });
          if (snap.size < 1000) break; last = snap.docs[snap.docs.length - 1].id;
        }
      }));
      return;
    }
    try { const raw = localStorage.getItem('traxup_imob_v1'); if (raw) { const j = JSON.parse(raw); for (const c of COLS) this.data[c] = j[c] || {}; } } catch (e) { /* armazenamento indisponível */ }
  },
  authH() { return this.token ? { Authorization: 'Bearer ' + this.token } : {}; },
  list(c) { return Object.values(this.data[c] || {}); },
  get(c, id) { return id ? (this.data[c] || {})[id] : undefined; },
  saveLocal() { try { localStorage.setItem('traxup_imob_v1', JSON.stringify(this.data)); } catch (e) { toast('Não foi possível gravar no navegador (espaço cheio?).', true); } },
  async put(c, o) {
    o = JSON.parse(JSON.stringify(o)); if (!o.id) o.id = uid(); o.atualizadoEm = new Date().toISOString();
    (this.data[c] ||= {})[o.id] = o;
    const key = c + '/' + o.id; const prev = this.queue[key] || Promise.resolve();
    const job = prev.catch(() => { }).then(() => this._write(c, o)); this.queue[key] = job; await job; return o;
  },
  async _write(c, o) {
    if (this.mode === 'server') { const r = await fetch(`api/data/${c}/${encodeURIComponent(o.id)}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', ...this.authH() }, body: JSON.stringify(o) }); if (!r.ok) { const j = await r.json().catch(() => ({})); throw Error(j.error || 'O servidor recusou a gravação.'); } return; }
    if (this.mode === 'db') { try { await this.db.collection(c).doc(o.id).set(o); } catch (e) { throw Error(e && e.code === 'quota_exceeded' ? 'A base atingiu o limite de armazenamento.' : e && e.code === 'invalid_argument' ? 'Sem permissão de gravação ou registro grande demais.' : 'Falha ao gravar: ' + (e && e.message || e)); } return; }
    this.saveLocal();
  },
  async del(c, id) {
    delete (this.data[c] || {})[id];
    if (this.mode === 'server') { const r = await fetch(`api/data/${c}/${encodeURIComponent(id)}`, { method: 'DELETE', headers: this.authH() }); if (!r.ok) throw Error('O servidor recusou a exclusão.'); return; }
    if (this.mode === 'db') { await this.db.collection(c).doc(id).delete(); return; }
    this.saveLocal();
  }
};

/* ---------- autenticação ---------- */
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
async function hashSenha(senha, saltHex) {
  const salt = saltHex ? unhex(saltHex) : crypto.getRandomValues(new Uint8Array(16));

const intBR = n => Math.round(n).toLocaleString('pt-BR');
function escalaBonita(max) { if (max <= 0) return { top: 100, step: 25 }; const raw = max / 4; const mag = Math.pow(10, Math.floor(Math.log10(raw))); const step = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].map(m => m * mag).find(st => st >= raw); return { top: step * 4, step }; }

  let mes = +S.f.recMes; if (!(mes >= 1 && mes <= 12)) mes = ano === anoAtual ? mesAtual : (12 - [...porMes].reverse().findIndex(m => m.total > 0)) || 12; if (mes > 12) mes = 12;
  const { top, step } = escalaBonita(Math.max(...porMes.map(m => m.total)) / 100);
  const H = 230; const ticks = [4, 3, 2, 1, 0].map(k => k * step);
  const sel = porMes[mes - 1]; const totalAno = soma(porMes, m => m.total); graficoRecebimentos.sel = { ano, mes };

/* ---------- Parcelas e baixas ---------- */
function linhasParcelas() {
  const f = S.f; const st = f.pst ?? 'Em aberto', q = norm(f.pq), ref = hoje(); const bols = new Set(Store.list('boletos').filter(b => b.status !== 'Cancelado').map(b => b.parcelaId));
  return L('vendas').filter(vendaAtiva).filter(v => { const l = loteDe(v); return (!f.pemp || l.empId === f.pemp) && (!f.pquad || l.quadra === f.pquad) && (!q || norm(cliNome(v.clienteId) + ' ' + v.numero + ' ' + loteDesc(v.loteId)).includes(q)); })
    .flatMap(v => (v.parcelas || []).map(p => ({ v, p }))).filter(({ p }) => {
      const sd = saldoParcela(p);
      const okSt = st === 'Todas' || (st === 'Em aberto' && sd > 0) || (st === 'Vencidas' && vencida(p, ref)) || (st === 'Pagas' && sd === 0) || (st === 'Parciais' && sd > 0 && pagoParcela(p) > 0) || (st === 'Vence hoje' && sd > 0 && p.venc === ref) || (st === 'Próximos 7 dias' && sd > 0 && p.venc >= ref && p.venc <= addDias(ref, 7)) || (st === 'Próximos 30 dias' && sd > 0 && p.venc >= ref && p.venc <= addDias(ref, 30)) || (st === 'Com encargos' && ((p.juros || 0) + (p.multa || 0)) > 0);
      const pagNoPeriodo = !f.ppini && !f.ppfim ? true : (p.pagamentos || []).some(x => (!f.ppini || x.data >= f.ppini) && (!f.ppfim || x.data <= f.ppfim));
      return okSt && pagNoPeriodo && (!f.ptp || p.tipo === f.ptp) && (!f.pini || p.venc >= f.pini) && (!f.pfim || p.venc <= f.pfim) && (!f.pdia || +p.venc.slice(8) === +f.pdia) && naFaixa(totalParcela(p), f.pmin, f.pmax) && (!f.pbol || (f.pbol === 'com' ? bols.has(p.id) : !bols.has(p.id)));
    }).sort((a, b) => a.p.venc.localeCompare(b.p.venc));
}

  const recPeriodo = periodoPag ? soma(rows, ({ p }) => soma((p.pagamentos || []).filter(x => (!f.ppini || x.data >= f.ppini) && (!f.ppfim || x.data <= f.ppfim)), x => x.valor)) : 0;

function linhasInad() {

  return L('vendas').filter(vendaAtiva).map(v => { const venc = vencidasVenda(v, ref); return { v, venc, valor: soma(venc, saldoParcela), dias: venc.length ? Math.max(...venc.map(p => diasEntre(p.venc, ref))) : 0, sit: situacaoVenda(v, ref) }; })
    .filter(x => { const l = loteDe(x.v); const [a, b] = (f.ifx || '').split('-').map(Number); return x.venc.length && (!f.ist || f.ist === 'Todos' || x.sit === f.ist) && (!f.iemp || l.empId === f.iemp) && (!f.iquad || l.quadra === f.iquad) && (!f.ifx || (x.dias >= a && (!b || x.dias <= b))) && (!f.imin || x.venc.length >= +f.imin) && naFaixa(x.valor, f.ivmin, '') && (!q || norm(cliNome(x.v.clienteId) + ' ' + x.v.numero + ' ' + loteDesc(x.v.loteId)).includes(q)); })

}

function partesDiscord(t) { const out = []; let s = String(t); while (s.length > 1990) { let cut = s.lastIndexOf('\n', 1990); if (cut < 1000) cut = 1990; out.push(s.slice(0, cut)); s = s.slice(cut).replace(/^\n/, ''); } if (s.trim()) out.push(s); return out; }
async function enviarDiscord(texto, hookIds) {
  const hooks = hookIds.map(id => Store.get('webhooks', id)).filter(Boolean); if (!hooks.length) throw Error('Selecione pelo menos um canal.'); if (!texto.trim()) throw Error('A mensagem está vazia.');
  const logDoc = Store.get('logs', 'discord') || { id: 'discord', itens: [] }; let ok = 0;
  for (const h of hooks) {
    let erro = ''; try { for (const parte of partesDiscord(texto)) { const r = await fetch('api/discord', { method: 'POST', headers: { 'Content-Type': 'application/json', ...Store.authH() }, body: JSON.stringify({ webhookId: h.id, content: parte }) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw Error(j.error || 'Falha no envio'); } ok++; } catch (e) { erro = e.message; }
    logDoc.itens = [{ data: new Date().toISOString(), canal: h.nome, filialId: h.filialId, texto, ok: !erro, erro, usuario: S.user.nome }, ...(logDoc.itens || [])].slice(0, 150);
  }
  await Store.put('logs', logDoc); return { ok, total: hooks.length };
}

async function lerModelo(f) {
  if (/\.docx$/i.test(f.name)) {
    if (!window.JSZip) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload = res; s.onerror = () => rej(Error('Não foi possível carregar o leitor de .docx. Salve o modelo como .txt e importe.')); document.head.append(s); });
    const zip = await window.JSZip.loadAsync(await f.arrayBuffer()); const xml = await zip.file('word/document.xml')?.async('string'); if (!xml) throw Error('Arquivo .docx inválido.');
    const doc = new DOMParser().parseFromString(xml, 'application/xml'); const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
    return [...doc.getElementsByTagNameNS(W, 'p')].map(p => { let t = ''; for (const n of p.getElementsByTagNameNS(W, '*')) { if (n.localName === 't') t += n.textContent; else if (n.localName === 'tab') t += '\t'; else if (n.localName === 'br') t += '\n'; } return t; }).join('\n').replace(/\n{3,}/g, '\n\n');
  }
  const t = await f.text(); if (/\.html?$/i.test(f.name)) { const d = new DOMParser().parseFromString(t, 'text/html'); return d.body.innerText || d.body.textContent; } return t;
}

async function restaurarArquivo(f) {
  const txt = await f.text(); let dados, titulo;
  if (/\.sql$/i.test(f.name) || /^\s*--\s*Vico/i.test(txt.slice(0, 200)) || /INSERT INTO records/.test(txt.slice(0, 5000))) {
    const r = converterVico(txt, [], f.name); dados = r.dados; const x = r.resumo;
    titulo = `Backup do <b>Vico</b> reconhecido: ${x.filiais} empresas (viram filiais), ${x.lotes} lotes, ${x.vendas} vendas, ${x.clientes} clientes, ${x.parcelas.toLocaleString('pt-BR')} parcelas, ${x.pagamentos} pagamentos e ${x.comissoes} comissões pagas.<br><br>Importar agora? Registros já importados antes são atualizados, sem duplicar.`;
  } else {
    let j; try { j = JSON.parse(txt); } catch (e) { throw Error('Arquivo inválido. Use o backup do TRAXUP (.json) ou do Vico (.sql).'); }
    dados = {}; for (const c of COLS) dados[c] = j[c] || {}; const n = COLS.reduce((t, c) => t + Object.keys(dados[c]).length, 0);
    if (!n) throw Error('O arquivo não tem registros do TRAXUP.');
    titulo = `Restaurar <b>${n}</b> registros deste backup? Registros com o mesmo código são substituídos.`;
  }
  confirmar(titulo, async () => {
    const itens = COLS.flatMap(c => Object.values(dados[c] || {}).filter(o => !(c === 'usuarios' && Store.mode === 'server' && !o.hash)).map(o => [c, o]));
    modal(`${mHead('Importação', 'Gravando registros…')}<div class="modalBody"><div class="meter"><i id="impBar" style="width:0%"></i></div><p class="hint" id="impTxt" style="margin-top:10px">0 de ${itens.length}</p></div>`, 'narrow');
    let n = 0; for (const [c, o] of itens) { await Store.put(c, o); n++; if (n % 10 === 0 || n === itens.length) { const b = $('#impBar'), t = $('#impTxt'); if (b) b.style.width = (n / itens.length * 100) + '%'; if (t) t.textContent = `${n} de ${itens.length}`; } }
    closeModal(); await audit(`Importou backup ${f.name} (${n} registros)`); toast(n + ' registros importados.'); S.filial = '*'; render();
  }, 'Importar');
}

  /* conciliação */
  importarExtrato: () => { const fs = filiaisUsuario(); modal(`${mHead('Conciliação', 'Importar extrato bancário')}<form class="modalBody" data-form="importExtrato"><div class="formGrid" style="grid-template-columns:1fr 1fr"><label>Filial / conta${sel('filialId', fs.map(f => [f.id, f.nome + (f.bb?.conta ? ' · CC ' + f.bb.conta : '')]), filialPadrao())}</label><label>Arquivo (OFX ou CSV)<input type="file" name="arquivo" accept=".ofx,.csv,.txt" required></label></div><p class="hint" style="margin-top:10px">No Banco do Brasil: Extrato → Exportar → <b>Money (OFX)</b>. Lançamentos já importados (mesmo identificador) são ignorados.</p><div class="formActions"><button type="button" data-act="closeModal">Cancelar</button><button class="primary">Importar</button></div></form>`, 'narrow'); },
  ofxExemplo: async () => { const ps = L('vendas').filter(vendaAtiva).flatMap(v => (v.parcelas || []).filter(p => saldoParcela(p) > 0 && p.venc <= addDias(hoje(), 20)).slice(0, 2).map(p => ({ v, p }))).slice(0, 6); const tx = ps.map(({ v, p }, i) => { const b = Store.list('boletos').find(x => x.parcelaId === p.id && x.status !== 'Cancelado'); return `<STMTTRN><TRNTYPE>CREDIT<DTPOSTED>${(p.venc < hoje() ? hoje() : p.venc).replace(/-/g, '')}120000<TRNAMT>${(saldoParcela(p) / 100).toFixed(2)}<FITID>EX${Date.now()}${i}<MEMO>${b ? 'LIQ COBRANCA ' + b.nossoNumero : 'PIX RECEBIDO ' + cliNome(v.clienteId).toUpperCase()}</STMTTRN>`; }); tx.push(`<STMTTRN><TRNTYPE>DEBIT<DTPOSTED>${hoje().replace(/-/g, '')}120000<TRNAMT>-35.90<FITID>EXT${Date.now()}<MEMO>TARIFA PACOTE SERVICOS</STMTTRN>`); const ofx = `OFXHEADER:100\nDATA:OFXSGML\nVERSION:102\n\n<OFX><BANKMSGSRSV1><STMTTRNRS><STMTRS><CURDEF>BRL<BANKACCTFROM><BANKID>001<ACCTID>45678-9</BANKACCTFROM><BANKTRANLIST>${tx.join('\n')}</BANKTRANLIST></STMTRS></STMTTRNRS></BANKMSGSRSV1></OFX>`; await salvarArquivo('extrato_exemplo.ofx', ofx, 'application/x-ofx'); if (Store.mode === 'db' && !Store.downloads) { await importarTextoExtrato(ofx, 'extrato_exemplo.ofx', filialPadrao()); } },
  conciliar: async el => { const { e, t } = acharTx(el.dataset.tx); const s = $(`select.sugSel[data-tx="${CSS.escape(t.fitid)}"]`); const [vid, pid] = s.value.split('|'); try { await conciliarTx(e, t, vid, pid); await Store.put('extratos', e); toast('Lançamento conciliado e baixa registrada.'); renderView(); } catch (err) { toast(err.message, true); } },
  conciliarTudo: async () => { const e = Store.get('extratos', S.f.ext); let n = 0; const usadas = new Set(); for (const t of e.transacoes) { if ((t.status || 'pendente') !== 'pendente' || t.valor <= 0) continue; const s = sugerirConciliacao(t, L('vendas'), L('boletos')).filter(x => !usadas.has(x.parcelaId)); if (s[0] && s[0].score >= 65 && (!s[1] || s[1].vendaId === s[0].vendaId || s[0].score - s[1].score >= 15)) { await conciliarTx(e, t, s[0].vendaId, s[0].parcelaId); usadas.add(s[0].parcelaId); n++; } } await Store.put('extratos', e); toast(n ? `${n} lançamento(s) conciliado(s). Confira os demais manualmente.` : 'Nenhuma sugestão forte o bastante para conciliar automaticamente.'); renderView(); },

  ignorarTx: async el => { const { e, t } = acharTx(el.dataset.tx); t.status = 'ignorado'; await Store.put('extratos', e); renderView(); },
  reativarTx: async el => { const { e, t } = acharTx(el.dataset.tx); t.status = 'pendente'; await Store.put('extratos', e); renderView(); },
  desconciliar: el => confirmar('Desfazer a conciliação? O pagamento lançado por ela será estornado da parcela.', async () => { const { e, t } = acharTx(el.dataset.tx); const v = Store.get('vendas', t.vinculo?.vendaId); const p = v?.parcelas.find(x => x.id === t.vinculo?.parcelaId); if (p) { const i = p.pagamentos.findIndex(q => q.fitid === t.fitid); if (i >= 0) { const q = p.pagamentos.splice(i, 1)[0]; const extra = Math.max(0, q.valor - p.valor); p.juros = Math.max(0, (p.juros || 0) - extra); } hist(v, 'Conciliação desfeita: ' + brl(t.valor)); await Store.put('vendas', v); const b = Store.list('boletos').find(x => x.parcelaId === p.id && x.status === 'Pago'); if (b && saldoParcela(p) > 0) { b.status = b.registroBB ? 'Registrado' : 'Emitido'; await Store.put('boletos', b); } } t.status = 'pendente'; delete t.vinculo; await Store.put('extratos', e); toast('Conciliação desfeita.'); renderView(); }, 'Desfazer'),

  editFilial: el => formFilial(Store.get('filiais', el.dataset.id)),
  editEmp: el => formEmp(Store.get('empreendimentos', el.dataset.id)),
  recMes: el => { S.f.recMes = +el.dataset.m; if (!S.f.recAno) S.f.recAno = hoje().slice(0, 4); renderView(); },
  recDetalhes: el => { Object.assign(S.f, { pst: 'Todas', ppini: el.dataset.ini, ppfim: el.dataset.fim }); S.view = 'financeiro'; render(); },
  verFilial: el => { S.filial = el.dataset.id; render(); },
  delFilial: el => confirmar('Excluir esta filial? Ela não tem lotes, clientes nem vendas.', async () => { const id = el.dataset.id; await Store.del('filiais', id); for (const u of Store.list('usuarios').filter(u => (u.filiais || []).includes(id))) { u.filiais = u.filiais.filter(x => x !== id); await Store.put('usuarios', u); } if (S.filial === id) S.filial = '*'; await audit('Excluiu filial vazia'); closeModal(); toast('Filial excluída.'); render(); }, 'Excluir'),
  backup: async () => { const dump = {}; for (const c of COLS) dump[c] = Store.data[c]; await salvarArquivo(`traxup_imobiliario_backup_${hoje()}.json`, JSON.stringify(dump, null, 1), 'application/json'); await audit('Exportou backup'); },
  removerDemo: () => { const d = dadosDemo(); confirmar(`Remover os dados de demonstração? Serão excluídos <b>${d.vendas.length} vendas</b>, <b>${d.lotes.length} lotes</b>, <b>${d.clientes.length} clientes</b>, ${d.emps.length} empreendimento(s) e ${d.boletos.length} boleto(s) de exemplo. Os dados importados do Vico não são afetados.`, async () => { for (const [c, arr] of [['boletos', d.boletos], ['vendas', d.vendas], ['lotes', d.lotes], ['clientes', d.clientes], ['plantas', d.plantas], ['empreendimentos', d.emps]]) for (const o of arr) await Store.del(c, o.id); await audit('Removeu dados de demonstração'); toast('Dados de demonstração removidos.'); render(); }, 'Remover'); },
  demo: () => confirmar('Adicionar dados de demonstração na filial selecionada?', async () => { await carregarDemo(filialPadrao()); toast('Dados de demonstração carregados.'); render(); }, 'Carregar')
};
const acharTx = fitid => { for (const e of Store.list('extratos')) { const t = e.transacoes.find(t => t.fitid === fitid); if (t) return { e, t }; } throw Error('Lançamento não encontrado.'); };
async function importarTextoExtrato(txt, nome, filialId) {
  const r = /<OFX>|<STMTTRN>/i.test(txt) ? parseOFX(txt) : parseCSVExtrato(txt);
  const ja = new Set(Store.list('extratos').flatMap(e => e.transacoes.map(t => t.fitid)));
  const novos = r.transacoes.filter(t => !ja.has(t.fitid)).map(t => ({ ...t, status: 'pendente' }));
  if (!r.transacoes.length) throw Error('Nenhum lançamento encontrado no arquivo.');
  if (!novos.length) throw Error('Todos os lançamentos deste arquivo já foram importados.');
  const e = await Store.put('extratos', { filialId, arquivo: nome, banco: r.banco === '001' ? 'Banco do Brasil' : r.banco, conta: r.conta, importadoEm: new Date().toISOString(), importadoPor: S.user.nome, transacoes: novos });
  S.f.ext = e.id; S.f.cst = 'pendente'; toast(`${novos.length} lançamento(s) importado(s)${r.transacoes.length > novos.length ? `, ${r.transacoes.length - novos.length} já existiam` : ''}.`); renderView();
}

const FORMS = {
  async login(v) {
    const login = norm(v.login).trim();
    if (Store.mode === 'server') {
      const r = await fetch('api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ login: v.login, senha: v.senha }) }); const j = await r.json().catch(() => ({}));
      if (!r.ok) return telaLogin(j.error || 'Login ou senha inválidos.'); Store.token = j.token; await Store.loadAll(); S.user = Store.get('usuarios', j.userId); return entrar();
    }
    const u = Store.list('usuarios').find(x => norm(x.login) === login || (x.email && norm(x.email) === login));
    if (!u || u.ativo === false) return telaLogin('Login ou senha inválidos.');
    const h = await hashSenha(v.senha, u.salt); if (h.hash !== u.hash) return telaLogin('Login ou senha inválidos.');
    u.ultimoAcesso = new Date().toISOString(); S.user = u; Store.put('usuarios', u).catch(() => { }); entrar();
  },
  async setup(v) {
    const cid = v.cidade || ''; const [cidade, uf] = cid.split('/').map(s => s.trim());
    const filial = { id: uid(), nome: v.filial, razao: v.filial, cnpj: v.cnpj, cidade: cidade || '', uf: (uf || '').toUpperCase(), multa: 2, jurosMes: 1, bb: { carteira: '17', variacao: '35' } };
    const h = await hashSenha(v.senha); const user = { id: uid(), nome: v.nome, login: v.login.trim(), perfil: 'Administrador', filiais: ['*'], ativo: true, salt: h.salt, hash: h.hash, criadoEm: new Date().toISOString() };
    if (Store.mode === 'server') {
      const r = await fetch('api/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ filial, usuario: user, senha: v.senha }) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw Error(j.error || 'Falha na configuração.');
      Store.token = j.token; await Store.loadAll();
    } else { await Store.put('filiais', filial); await Store.put('usuarios', user); }
    S.user = Store.get('usuarios', user.id) || user;
    await Store.put('modelos', { tipo: 'contrato', nome: 'Promessa de compra e venda (modelo base)', filialId: filial.id, conteudo: MODELO_PADRAO, criadoEm: new Date().toISOString() });
    if (v.demo) await carregarDemo(filial.id);
    await audit('Configuração inicial do sistema'); entrar();
  },
  async lote(v, f) {
    const l = Store.get('lotes', f.dataset.id) || {}; const emp = Store.get('empreendimentos', v.empId);
    const dup = Store.list('lotes').find(x => x.id !== l.id && x.empId === v.empId && norm(x.quadra) === norm(v.quadra) && norm(x.numero) === norm(v.numero)); if (dup) throw Error('Já existe esse lote neste empreendimento.');
    Object.assign(l, { empId: v.empId, filialId: emp.filialId, quadra: v.quadra.trim().toUpperCase(), numero: v.numero.trim(), area: v.area, frente: v.frente, fundo: v.fundo, status: v.status, preco: toCents(v.preco), custo: v.custo ? toCents(v.custo) : undefined, matricula: v.matricula, confrontacoes: v.confrontacoes, obs: v.obs });
    const s = await Store.put('lotes', l); S.sel.lote = s.id; closeModal(); toast('Lote salvo.'); renderView();
  },
  async loteSerie(v) {
    const emp = Store.get('empreendimentos', v.empId); const qs = v.quadras.split(/[,;\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean); let n = 0;
    for (const q of qs) for (let i = 1; i <= +v.qtd; i++) { if (Store.list('lotes').some(x => x.empId === emp.id && norm(x.quadra) === norm(q) && String(x.numero) === String(i))) continue; await Store.put('lotes', { empId: emp.id, filialId: emp.filialId, quadra: q, numero: String(i), area: v.area, frente: v.frente, fundo: v.fundo, preco: toCents(v.preco), status: 'Disponível' }); n++; }
    closeModal(); toast(`${n} lote(s) criado(s).`); S.f.mapaEmp = emp.id; renderView();
  },
  async cliente(v, f) {
    const c = Store.get('clientes', f.dataset.id) || { filialId: filialPadrao() }; Object.assign(c, v); c.nome = c.nome.trim(); if (!c.conjugeDeId) delete c.conjugeDeId; if (c.conjugeDeId === c.id) throw Error('Um cadastro não pode ser cônjuge de si mesmo.');
    const dupe = c.cpf && Store.list('clientes').find(x => x.id !== c.id && onlyDigits(x.cpf) && onlyDigits(x.cpf) === onlyDigits(c.cpf)); if (dupe) throw Error('CPF/CNPJ já cadastrado para ' + dupe.nome + '.');
    const s = await Store.put('clientes', c); closeModal(); toast('Cliente salvo.'); const after = formCliente.after; formCliente.after = null; if (after) after(s); else renderView();
  },
  async reserva(v, f) { const l = Store.get('lotes', f.dataset.id); Object.assign(l, { status: 'Reservado', reservaPara: v.reservaPara, reservaAte: v.reservaAte }); await Store.put('lotes', l); closeModal(); toast('Lote reservado.'); renderView(); },
  async venda(v) {
    const lote = Store.get('lotes', v.loteId); if (!v.clienteId) throw Error('Selecione o cliente.'); if (lote.status === 'Vendido') throw Error('Este lote já foi vendido.');
    const valor = toCents(v.valor); const parcelas = [...serieParcelas('Entrada', toCents(v.eTotal), +v.eQtd, v.eVenc, 1), ...serieParcelas('Mensal', toCents(v.mTotal), +v.mQtd, v.mVenc, 1), ...serieParcelas('Intercalada', toCents(v.iTotal), +v.iQtd, v.iVenc, +v.iInt || 12)];
    if (!parcelas.length) throw Error('Informe ao menos uma série de parcelas.');
    const sp = soma(parcelas, p => p.valor); if (sp !== valor && !confirmVenda.ok) { confirmVenda.ok = true; throw Error(`A soma das parcelas (${brl(sp)}) difere do valor da venda (${brl(valor)}). Clique novamente para confirmar assim mesmo.`); } confirmVenda.ok = false;
    const nums = Store.list('vendas').filter(x => x.filialId === lote.filialId).map(x => +String(x.numero).replace(/\D/g, '') || 0);
    const venda = await Store.put('vendas', { filialId: lote.filialId, numero: 'VD-' + String(Math.max(0, ...nums) + 1).padStart(4, '0'), loteId: lote.id, clienteId: v.clienteId, data: v.data, valor, corretor: v.corretor.trim(), comissaoPct: parseFloat(String(v.comissaoPct).replace(',', '.')) || 0, comissoesPagas: [], indice: v.indice, reajuste: v.reajuste, status: 'Ativo', classificacao: 'Automático', parcelas, historico: [{ data: new Date().toISOString(), usuario: S.user.nome, acao: `Venda criada: ${brl(valor)}, ${parcelas.length} parcelas` }] });
    lote.status = 'Vendido'; delete lote.reservaPara; await Store.put('lotes', lote); await audit(`Venda ${venda.numero} — ${loteDesc(lote.id)} para ${cliNome(v.clienteId)}`);
    closeModal(); toast('Venda registrada com ' + parcelas.length + ' parcelas.'); renderView(); verVenda(venda.id);
  },
  async parcelaAvulsa(v, f) { const venda = Store.get('vendas', f.dataset.v); venda.parcelas.push({ id: uid(), tipo: v.tipo, ref: v.ref || 'avulsa', venc: v.venc, valor: toCents(v.valor), juros: 0, multa: 0, pagamentos: [] }); hist(venda, `Parcela incluída: ${v.tipo} ${dataBR(v.venc)} ${brl(toCents(v.valor))}`); await Store.put('vendas', venda); closeModal(); verVenda(venda.id); renderView(); },
  async editParcela(v, f) { const venda = Store.get('vendas', f.dataset.v), p = venda.parcelas.find(x => x.id === f.dataset.p); const antes = `${p.tipo} ${dataBR(p.venc)} ${brl(p.valor)}`; Object.assign(p, { tipo: v.tipo, venc: v.venc, valor: toCents(v.valor) }); hist(venda, `Parcela corrigida (${antes} → ${p.tipo} ${dataBR(p.venc)} ${brl(p.valor)}). Motivo: ${v.motivo}`); await Store.put('vendas', venda); closeModal(); verVenda(venda.id); renderView(); },
  async baixa(v, f) { const venda = Store.get('vendas', f.dataset.v), p = venda.parcelas.find(x => x.id === f.dataset.p); const valor = toCents(v.valor); if (valor <= 0) throw Error('Informe o valor recebido.'); await registrarPagamento(venda, p, { valor, data: v.data, juros: toCents(v.juros), multa: toCents(v.multa), obs: v.obs, forma: v.forma }); closeModal(); toast('Baixa registrada.'); renderView(); },
  async boletoLote(v) { const alvos = L('vendas').filter(vendaAtiva).flatMap(x => (x.parcelas || []).filter(p => saldoParcela(p) > 0 && p.venc >= v.ini && p.venc <= v.fim).map(p => ({ x, p }))); let n = 0, sem = 0; for (const { x, p } of alvos) { if (Store.list('boletos').some(b => b.parcelaId === p.id && b.status !== 'Cancelado')) continue; const b = await emitirBoleto(x.id, p.id, true); b ? n++ : sem++; } closeModal(); toast(`${n} boleto(s) emitido(s)${sem ? `; ${sem} sem convênio BB configurado` : ''}.`, !!sem); renderView(); },
  async importExtrato(v, f) { const file = f.arquivo.files[0]; if (!file) throw Error('Selecione o arquivo.'); let txt = await file.text(); if (/\uFFFD/.test(txt)) txt = new TextDecoder('windows-1252').decode(await file.arrayBuffer()); closeModal(); await importarTextoExtrato(txt, file.name, v.filialId); },
  async concManual(v, f) { const { e, t } = acharTx(f.dataset.tx); const [vid, pid] = v.alvo.split('|'); await conciliarTx(e, t, vid, pid); await Store.put('extratos', e); closeModal(); toast('Conciliado.'); renderView(); },
  async comissao(v, f) { const venda = Store.get('vendas', f.dataset.id); (venda.comissoesPagas ||= []).push({ valor: toCents(v.valor), data: v.data, obs: v.obs, usuario: S.user.nome }); hist(venda, `Comissão paga: ${brl(toCents(v.valor))}`); await Store.put('vendas', venda); closeModal(); toast('Pagamento de comissão registrado.'); renderView(); },
  async hook(v, f) { if (!/^https:\/\/(discord|discordapp)\.com\/api\/webhooks\/\d+\/[\w-]+/.test(v.url.trim())) throw Error('URL de webhook do Discord inválida.'); const h = Store.get('webhooks', f.dataset.id) || {}; Object.assign(h, { nome: v.nome, filialId: v.filialId, url: v.url.trim() }); await Store.put('webhooks', h); closeModal(); toast('Canal salvo.'); renderView(); },
  async modeloDiscord(v) { const m = await Store.put('modelos', { tipo: 'discord', nome: v.nome, filialId: filialPadrao(), conteudo: S.discord.texto }); S.discord.modelo = 'salvo:' + m.id; closeModal(); toast('Modelo salvo.'); renderView(); },
  async escolheModelo(v, f) { closeModal(); previewContrato(f.dataset.v, v.mid); },
  async user(v, f) {
    const u = Store.get('usuarios', f.dataset.id) || { criadoEm: new Date().toISOString() };
    if (Store.list('usuarios').some(x => x.id !== u.id && norm(x.login) === norm(v.login))) throw Error('Já existe um usuário com esse login.');
    const filiais = Object.keys(v).filter(k => k.startsWith('fil_')).map(k => k.slice(4));
    if (u.id === S.user.id && v.perfil !== 'Administrador' && S.user.perfil === 'Administrador') throw Error('Você não pode remover o seu próprio perfil de administrador.');
    Object.assign(u, { nome: v.nome, email: v.email, login: v.login.trim(), perfil: v.perfil, ativo: v.ativo === '1', filiais: filiais.length ? filiais : [filialPadrao()] });
    if (v.senha) { if (v.senha.length < 6) throw Error('A senha precisa ter ao menos 6 caracteres.'); Object.assign(u, await hashSenha(v.senha)); }
    await Store.put('usuarios', u); await audit(`Usuário ${u.login} salvo (${u.perfil})`); closeModal(); toast('Usuário salvo.'); renderView();
  },
  async filial(v, f) {
    const fl = Store.get('filiais', f.dataset.id) || {}; if (v.bb_convenio && !/^\d{7}$/.test(v.bb_convenio)) throw Error('O convênio deve ter 7 dígitos.');
    Object.assign(fl, { nome: v.nome, razao: v.razao, cnpj: v.cnpj, telefone: v.telefone, cidade: v.cidade, uf: v.uf.toUpperCase(), endereco: v.endereco, multa: parseFloat(String(v.multa).replace(',', '.')) || 0, jurosMes: parseFloat(String(v.jurosMes).replace(',', '.')) || 0, bb: { agencia: v.bb_agencia, conta: v.bb_conta, convenio: v.bb_convenio, carteira: v.bb_carteira, variacao: v.bb_variacao, beneficiario: v.bb_beneficiario, cnpj: v.bb_cnpj } });
    await Store.put('filiais', fl); await audit('Filial salva: ' + fl.nome); closeModal(); toast('Filial salva.'); render();
  },
  async emp(v, f) { const e = Store.get('empreendimentos', f.dataset.id) || {}; Object.assign(e, v); await Store.put('empreendimentos', e); for (const l of Store.list('lotes').filter(l => l.empId === e.id && l.filialId !== e.filialId)) { l.filialId = e.filialId; await Store.put('lotes', l); } closeModal(); toast('Empreendimento salvo.'); renderView(); },
  async minhaSenha(v, f) {
    if (Store.mode === 'server') { const r = await fetch('api/senha', { method: 'POST', headers: { 'Content-Type': 'application/json', ...Store.authH() }, body: JSON.stringify(v) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw Error(j.error || 'Não foi possível alterar.'); f.reset(); return toast('Senha alterada.'); }
    const u = Store.get('usuarios', S.user.id); const h = await hashSenha(v.atual, u.salt); if (h.hash !== u.hash) throw Error('Senha atual incorreta.'); Object.assign(u, await hashSenha(v.nova)); await Store.put('usuarios', u); f.reset(); toast('Senha alterada.');
  }
};
const confirmVenda = { ok: false };

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); try { await fn(el, e); } catch (err) { console.error(err); toast(err.message || String(err), true); }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); const fn = FORMS[f.dataset.form]; if (!fn) return;
  const btns = $$('button', f); btns.forEach(b => b.disabled = true);
  try { await fn(fd(f), f); } catch (err) { console.error(err); toast(err.message || String(err), true); } finally { btns.forEach(b => { if (b.isConnected) b.disabled = false; }); }
});
document.addEventListener('change', e => { if (e.target.id === 'filialSel') { S.filial = e.target.value; S.sel = {}; S.f.ext = null; S.f.mod = null; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#overlay')) closeModal(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (S.user && TITULOS[h] && h !== S.view && pode(S.user, h)) { S.view = h; render(); } });
boot();
