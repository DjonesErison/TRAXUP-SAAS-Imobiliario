<style id="appStyles">:root{
  --navy:#0A2463;--navy-2:#0E2F80;--blue:#1246B2;--blue-2:#1E5AD8;--blue-3:#E8EFFD;
  --orange:#FF9F1C;--orange-2:#FFB938;--orange-3:#FFF4E2;
  --bg:#F3F6FC;--card:#FFFFFF;--line:#DCE3F0;--text:#14213D;--muted:#5D6B86;
  --ok:#1F9D6B;--ok-3:#E3F6EE;--warn:#D98E04;--warn-3:#FFF3D6;--bad:#D64545;--bad-3:#FDE8E8;--gray:#9AA5B8;
  --radius:12px;--surface:#FFFFFF;--surface-2:#F7F9FD;--hover:#FAFBFF;--soft:#EDF1F8;--badge-text:#4A5875;--topbar:rgba(243,246,252,.92);--title:'Montserrat','Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--shadow:0 1px 2px rgba(10,36,99,.06),0 6px 18px rgba(10,36,99,.06);
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);font-size:15px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
h1,h2,h3,.brandText,.kpi strong{font-family:var(--title)}
h1{font-size:24px;margin:0;letter-spacing:-.4px}
h2{font-size:17px;margin:0}
h3{font-size:15px;margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface);min-width:0;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-2);outline-offset:0;border-color:transparent}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--text)}
label.check input{width:auto}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
button:hover{background:var(--blue-3)}
button:disabled{opacity:.55;cursor:not-allowed}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button.primary:hover{background:var(--blue-2)}
button.accent{background:var(--orange);color:#1b1300;border-color:var(--orange);font-weight:600}
button.accent:hover{background:var(--orange-2)}
button.danger{color:var(--bad);border-color:#f2c4c4}
button.danger:hover{background:var(--bad-3)}
button.ghost{border-color:transparent;background:transparent}
button.sm{padding:5px 9px;font-size:13px}
.icon{width:18px;height:18px;flex:none}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:linear-gradient(135deg,#0B3AA8 0%,#1246B2 45%,#0A2463 100%)}
.loginArt{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;color:#fff;text-align:center;gap:22px}
.loginArt img{width:min(380px,80%);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.loginArt p{max-width:420px;color:#cfdcff;line-height:1.6;margin:0}
.loginPanel{display:flex;align-items:center;justify-content:center;padding:30px}
.loginCard{background:var(--surface);border-radius:18px;padding:34px;width:min(440px,100%);box-shadow:0 30px 80px rgba(5,20,70,.4);display:grid;gap:16px}
.loginCard h1{font-size:22px}
.loginCard .sub{color:var(--muted);font-size:14px;margin-top:-8px}
.loginCard button.primary{justify-content:center;padding:12px}
.storageNote{font-size:12px;color:var(--muted);background:var(--bg);border-radius:9px;padding:9px 11px;line-height:1.5}

/* shell */
.shell{display:flex;min-height:100vh}
aside{width:248px;background:linear-gradient(180deg,var(--navy) 0%,#071B4D 100%);color:#fff;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:20px 12px;overflow-y:auto;z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand svg{width:40px;height:40px}
.brandText{font-weight:900;font-size:23px;letter-spacing:.5px;line-height:1}
.brandText b{color:var(--orange);font-weight:900}
.brandSub{font-size:9.5px;letter-spacing:2.2px;color:#9fb6ee;margin-top:4px;font-weight:600}
.brandLine{height:3px;margin:0 10px 16px;border-radius:3px;background:linear-gradient(90deg,var(--blue-2) 0 48%,transparent 48% 52%,var(--orange) 52%)}
nav{display:grid;gap:2px}
.navGroup{font-size:10.5px;letter-spacing:1.6px;color:#7f97d0;margin:14px 12px 6px;font-weight:700}
nav button{background:transparent;border:0;color:#c9d6f6;justify-content:flex-start;padding:9px 12px;border-radius:9px;font-size:14px;width:100%}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.active{background:var(--blue);color:#fff;box-shadow:inset 3px 0 0 var(--orange)}
.asideFoot{margin-top:auto;padding:14px 12px 0;font-size:11.5px;color:#7f97d0;line-height:1.6}
main{margin-left:248px;width:calc(100% - 248px);min-width:0}
.topbar{position:sticky;top:0;z-index:4;background:var(--topbar);backdrop-filter:blur(6px);display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--line)}
.topbar .title{flex:1;min-width:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--blue);text-transform:uppercase}
.filialPick{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 12px;font-size:13px;color:var(--muted)}
.filialPick select{border:0;padding:6px 8px;width:auto;font-weight:600;color:var(--text)}
.userChip{display:flex;align-items:center;gap:9px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--orange);color:#1b1300;display:grid;place-items:center;font-weight:800;font-family:var(--title)}
.content{padding:24px 28px 60px}
.menuToggle{display:none}

/* cards */
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi span{font-size:13px;color:var(--muted);display:block}
.kpi strong{display:block;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:9px 0 4px;letter-spacing:-.4px}
.kpi small{color:var(--muted);font-size:12px}
.kpi.hl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange)}
.kpi.bl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;min-width:0}
.cardHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cardHead p{margin:3px 0 0;color:var(--muted);font-size:13px}
.cardBody{padding:16px 18px}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.toolbar label{min-width:150px}
.toolbar .grow{flex:1;min-width:200px}
.spacer{flex:1}
.red{color:var(--bad)!important}.green{color:var(--ok)!important}.orange{color:var(--warn)!important}.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.notice{border-radius:10px;padding:11px 14px;font-size:13.5px;line-height:1.5;margin-bottom:14px;border:1px solid}
.notice.info{background:var(--blue-3);border-color:#c8d7fa;color:#14306f}
.notice.warn{background:var(--warn-3);border-color:#f3d998;color:#6b4700}
.notice.bad{background:var(--bad-3);border-color:#f2c4c4;color:#7c1f1f}
.notice.ok{background:var(--ok-3);border-color:#bfe8d5;color:#0f5a3c}

/* tables */
.tableWrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 12px;border-bottom:1px solid var(--soft);vertical-align:middle}
td small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
tr:hover td{background:var(--hover)}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.actions{white-space:nowrap;text-align:right}
td.actions button{margin-left:4px}
tfoot td{font-weight:700;background:var(--surface-2)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--badge-text);white-space:nowrap}
.badge.ok{background:var(--ok-3);color:var(--ok)}
.badge.warn{background:var(--warn-3);color:var(--warn)}
.badge.bad{background:var(--bad-3);color:var(--bad)}
.badge.blue{background:var(--blue-3);color:var(--blue)}

/* modal */

.toastBox{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:80}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:14px;max-width:380px;border-left:4px solid var(--orange)}

/* barra de empresas (painel) — identidade TRAXUP */

.empBar button.on{background:linear-gradient(180deg,var(--blue-2),var(--blue));border-color:var(--orange);color:#fff;box-shadow:0 3px 10px rgba(18,70,178,.4),inset 0 -2px 0 var(--orange)}

.dataBaixa{font-size:14px;font-weight:700;color:var(--text);padding:12px 14px;border:2px solid var(--orange);border-radius:12px;background:var(--orange-3);margin-top:4px}.dataBaixa input{font-size:16px;font-weight:600;max-width:240px}
.detailList .destaque{background:var(--blue-3);border-radius:8px;padding:8px 10px;border-bottom:0}.detailList .destaque b{font-size:16px}
.nnInfo{grid-column:span 1;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;font-size:12px;padding:8px 10px;border:1px dashed var(--line);border-radius:9px;color:var(--muted)}.nnInfo b{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--text)}
.acoesCusto{display:flex;flex-wrap:wrap;gap:6px;min-width:320px}.acoesCusto button{margin:0}
.custoTable td{vertical-align:top;padding-top:14px}
.expBtns{display:flex;gap:6px}.expBtns button{padding:6px 10px}
.bkGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.bkBox{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface-2)}.bkBox h3{display:flex;align-items:center;gap:8px;margin-bottom:6px}.bkBox p{margin-bottom:12px}
.bkFile{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;cursor:pointer;color:var(--text);font-size:14px;font-weight:500}
.bkAuto{margin-top:16px;border-top:1px dashed var(--line)}
@media (max-width:820px){.expBtns{display:none}}
/* receita projetada */
.ipcaBox{flex-direction:row;align-items:center;gap:8px}.ipcaBox span{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--muted)}.ipcaBox input{width:90px}
.fcTotal{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:12px;background:var(--surface-2);margin-bottom:16px}

@media (max-width:1000px){.fcGrid{grid-template-columns:1fr}.ipcaBox{flex-direction:column;align-items:flex-start}}
/* ranking de vencidos */
.rankList{display:grid;gap:6px}
.rankRow{display:grid;grid-template-columns:44px minmax(180px,1.4fr) 140px minmax(120px,1.6fr) 150px;align-items:center;gap:16px;width:100%;text-align:left;padding:14px 16px;border:1px solid transparent;border-bottom-color:var(--soft);border-radius:12px;background:transparent;font-weight:400;white-space:normal}
.rankRow:hover{background:var(--hover)}
.rankRow.top{background:var(--blue-3);border-color:#C8D7FA}
body.dark .rankRow{background:transparent;border-color:transparent;border-bottom-color:var(--soft)}body.dark .rankRow.top{background:#16295A;border-color:#2A4690}body.dark .rankRow:hover{background:var(--hover)}
.rankN{font-family:var(--title);font-weight:800;font-size:22px;color:var(--blue-2);text-align:center}
.rankNome b{display:block;font-size:15px;text-transform:uppercase;letter-spacing:.2px}.rankNome small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.rankSit{justify-self:start;padding:7px 16px;border-radius:8px;font-size:13px;font-weight:700;text-align:center;min-width:120px}

body.dark .rankSit.bad{color:#FF8A94}body.dark .rankSit.warn{color:#FFB84D}
.rankBar{height:10px;border-radius:9px;background:var(--soft);overflow:hidden}.rankBar i{display:block;height:100%;border-radius:9px}
.rankBar i.bad{background:linear-gradient(90deg,#E5566B,var(--bad))}.rankBar i.warn{background:linear-gradient(90deg,var(--orange-2),var(--orange))}
.rankVal{font-family:var(--title);font-weight:800;font-size:17px;text-align:right;white-space:nowrap}
@media (max-width:900px){.rankRow{grid-template-columns:32px 1fr auto;gap:8px 12px}.rankSit{grid-column:2;min-width:0;padding:4px 10px}.rankBar{grid-column:2/4}.rankVal{grid-column:3;grid-row:1}}
/* gráficos do painel */
.bigNum{font-family:var(--title);font-weight:800;font-size:30px;letter-spacing:-.5px;margin-top:4px}
.previsao .vLabels span{font-size:11.5px;white-space:nowrap}
.previsao .vBar i{background:linear-gradient(180deg,#FFD27A,var(--orange-2))}.previsao .vBar.on i{background:linear-gradient(180deg,var(--blue-2),var(--blue));box-shadow:0 4px 14px rgba(18,70,178,.35)}.previsao .vLabels .on{color:var(--blue)}

.vchart{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.vAxis{display:flex;flex-direction:column;justify-content:space-between;font-size:11.5px;color:var(--muted);text-align:right;margin:-7px 0;font-variant-numeric:tabular-nums}
.vPlot{position:relative;border-bottom:1px solid var(--line)}
.vGrid{position:absolute;left:0;right:0;border-top:1px dashed var(--soft)}
.vBars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,1fr);gap:10px;align-items:end;padding:0 4px}
.vBar{height:100%;border:0;background:transparent;padding:0;display:flex;align-items:flex-end;justify-content:center;border-radius:0}
.vBar:hover{background:rgba(30,90,216,.05)}
.vBar i{display:block;width:100%;max-width:46px;border-radius:7px 7px 0 0;background:linear-gradient(180deg,var(--blue-2),var(--blue));transition:filter .15s}
.vBar:hover i{filter:brightness(1.12)}
.vBar.now i{background:linear-gradient(180deg,#5C8BFF,var(--blue-2))}
.vBar.on i{background:linear-gradient(180deg,var(--orange-2),var(--orange));box-shadow:0 4px 14px rgba(255,159,28,.35)}
.vLabels{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;padding:6px 4px 0;font-size:12.5px;color:var(--muted);text-align:center}
.vLabels .on{color:#B86A00;font-weight:700}
.mesBox{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:linear-gradient(180deg,var(--surface-2),var(--surface));border-left:4px solid var(--orange)}

.mesGrid b{font-family:var(--title);font-size:17px;white-space:nowrap}
.mesGrid div:first-child b{color:var(--ok)}
.donutWrap{display:flex;justify-content:center;padding:6px 0}
.donut{width:min(250px,100%);height:auto}

.dLbl{font-size:13px;fill:var(--muted)}

.resTable td,.resTable th{white-space:nowrap}
.comGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.comEmp{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.comEmp h3{font-size:15px;margin-bottom:8px}
.comNums{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px 12px;margin-bottom:10px}.comNums div{min-width:0}
.comNums span,.comTot span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}

.cBlue{color:var(--blue)}.cOrange{color:#C77700}
.stackBar{display:flex;height:9px;border-radius:9px;overflow:hidden;background:var(--soft)}.stackBar i{display:block;height:100%}
.comTot{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px;padding:14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.comTot b{font-family:var(--title);font-size:17px;white-space:nowrap}
/* charts */
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;padding:10px 4px 0}
.barCol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;height:100%;justify-content:flex-end}

/* ---------- Mercado e índices ---------- */
#mercadoCard{margin-bottom:18px}.mAcoes{display:flex;align-items:center;gap:10px}
.mQuotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}

.mQ strong{display:block;font-family:var(--title);font-size:19px;margin:8px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mQ small{color:var(--muted);font-size:11.5px}
.mSpark{width:100%;height:30px;display:block}.mIdx .mSpark{width:110px;height:26px}

/* ---------- Assinatura do contrato ---------- */

.asPassos{display:flex;flex-direction:column;gap:12px;margin:14px 0}

.asN{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800}.asPasso.ok .asN{background:#16A34A}.asN svg{width:17px;height:17px}
.asPasso>div>b{display:block;font-size:14.5px}.asPasso p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.5}

.asUp,.btnLink{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;background:var(--card);color:var(--text);text-decoration:none}.asUp:hover,.btnLink:hover{border-color:var(--blue);color:var(--blue)}.asUp svg,.btnLink svg{width:15px;height:15px}

/* cards de atraso do painel (Saldo vencido · Saldo inadimplente · Total em atraso) */

.atCard{--c:#8B5CF6;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:var(--radius);padding:18px 20px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 12%,var(--card)) 0%,var(--card) 70%);box-shadow:var(--shadow);min-width:0}

.mFaixa{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:18px;flex-wrap:wrap}
.mFaixa h3{margin:0;font-size:15px}.mFaixa p{margin:2px 0 0;color:var(--muted);font-size:13px}
.mFaixaIc{width:38px;height:38px;border-radius:10px;background:var(--blue-3);display:grid;place-items:center;color:var(--blue);flex:none}.mFaixaIc .icon{width:20px;height:20px}
.mAcoes{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.swTgl{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:none;border:0;padding:4px 2px;cursor:pointer;box-shadow:none}
.swTgl:hover{background:none;color:var(--text)}
.swTgl i{width:38px;height:22px;border-radius:99px;background:#C9D2E3;position:relative;display:inline-block;transition:background .15s}
.swTgl i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.swTgl.on i{background:var(--blue)}.swTgl.on i::after{left:19px}
body.dark .swTgl i{background:#3A4B78}body.dark .swTgl.on i{background:var(--blue-2)}
.bTipoRow{display:flex;align-items:center;gap:12px;margin:2px 0 12px;font-size:14px;font-weight:700}
.bAloc{margin-top:10px}.alocGrid{display:grid;grid-template-columns:auto auto;justify-content:start;gap:4px 18px;margin:8px 0 6px}.alocGrid b{text-align:right}
.jmTab input{max-width:110px;text-align:right;margin-left:auto}.jmTab td{vertical-align:middle}.jmTab .jmEx{font-size:12.5px;white-space:nowrap}
.metaBar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 4px}.metaBar i{display:block;height:100%;background:var(--orange);border-radius:6px}.metaBar i.ok{background:var(--ok,#16a34a)}
.metaChart{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end}.mc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}.mc span{color:var(--muted);font-size:11.5px;white-space:nowrap}
.mcBar{position:relative;height:150px;width:100%;max-width:46px;background:var(--bg);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}.mcBar i{display:block;width:100%;background:var(--blue);border-radius:8px 8px 0 0}.mcBar i.ok{background:var(--ok,#16a34a)}.mcBar b{position:absolute;left:0;right:0;border-top:2px dashed var(--orange)}
.empChecks{display:flex;flex-wrap:wrap;gap:8px 18px}.empChecks small{margin-left:4px}

/* Vendas: colunas em destaque (Total mensal, Intercalada, Recebido) */
th.colDest{background:color-mix(in srgb,var(--blue-2) 14%,transparent);color:var(--navy);border-bottom:2px solid var(--orange)}
td.colDest{background:color-mix(in srgb,var(--blue-2) 6%,transparent);font-weight:700}
td.colDest.green{color:var(--green,#16A34A)}
body.dark th.colDest{color:#fff}

/* botões de ação com ícone colorido */
.tbs{display:flex;justify-content:flex-end;gap:7px}
.tb{--c:#8B5CF6;width:34px;height:34px;padding:0;display:inline-grid;place-items:center;border-radius:9px;border:1px solid color-mix(in srgb,var(--c) 28%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);box-shadow:none;flex:none}
.tb .icon{width:17px;height:17px;margin:0}.tb:hover{background:color-mix(in srgb,var(--c) 22%,transparent);border-color:color-mix(in srgb,var(--c) 45%,transparent);color:var(--c)}
body.dark .tb{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:color-mix(in srgb,var(--c) 30%,transparent);color:var(--c)}
.tb.e{--c:#8B5CF6}.tb.l{--c:#F59E0B}.tb.u{--c:#16A34A}.tb.p{--c:#3B82F6}.tb.d{--c:#EF4444}
.tb.v{--c:#2563EB}.tb.g{--c:#16A34A}.tb.c{--c:#0891B2}
td.actions .tb{margin-left:5px;vertical-align:middle}

/* Vendas: filtros organizados e tabela compacta */
.vFiltros{padding:14px 16px;margin-bottom:14px;display:grid;gap:12px}
.vFiltros label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.vFiltros input,.vFiltros select{height:38px}
.vfL1{display:grid;grid-template-columns:minmax(260px,2.4fr) repeat(4,minmax(130px,1fr));gap:12px;align-items:end}
.vfL2{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding-top:12px;border-top:1px dashed var(--line)}
.fRange{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
.fRange>div{display:flex;align-items:center;gap:6px}.fRange i{font-style:normal;font-weight:500;font-size:12px}
.fRange input{height:38px;width:150px}
.vfL2 button{height:38px}
@media (max-width:1100px){.vfL1{grid-template-columns:1fr 1fr}.vfBusca{grid-column:1/-1}}
table.tCompact td{padding:7px 12px}table.tCompact th{padding:9px 12px}
table.tCompact td small{margin-top:1px}
td.nw{white-space:nowrap}
table.tCompact td.tCli{min-width:230px;font-size:13px}

/* caixa de filtros padrão (todas as telas) */
.fBox{padding:14px 16px;margin-bottom:14px}
.fLinha{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.fLinha.fL2{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.fLinha>label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:140px;flex:1 1 140px;max-width:220px}
.fLinha>label.grow{flex:3 1 260px;max-width:none}
.fLinha input,.fLinha select,.fLinha button{height:38px}
.fLinha .fRange input{width:140px}
.fLinha .spacer{flex:1 1 0;min-width:0}
/* linha da tabela sob o mouse: destaque mais vivo, com faixa laranja à esquerda */
tbody tr:hover td,tbody tr:hover td.colDest{background:#DCE8FF}
tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
body.dark tbody tr:hover td,body.dark tbody tr:hover td.colDest{background:#24407F}
/* menu lateral: barra de rolagem invisível; aparece fina e discreta só ao passar o mouse */
aside{scrollbar-width:none}
aside::-webkit-scrollbar{width:0;height:0}
aside:hover{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
aside:hover::-webkit-scrollbar{width:5px}
aside::-webkit-scrollbar-track{background:transparent}
aside::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:99px}
aside::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.4)}
/* demais áreas com rolagem: barra fina no padrão do sistema */
.tableWrap,.modalBody{scrollbar-width:thin;scrollbar-color:#B8C5E0 transparent}
body.dark .tableWrap,body.dark .modalBody{scrollbar-color:#2F4478 transparent}

/* organizar cards */
.orgBtn.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.layOculto{display:none!important}
.orgMode .layOculto{display:revert!important;opacity:.38;filter:grayscale(.6)}
.orgMode .layItem{position:relative;cursor:grab;outline:2px dashed color-mix(in srgb,var(--blue-2) 45%,transparent);outline-offset:3px;touch-action:none;user-select:none;animation:layTreme .9s ease-in-out infinite alternate}
.orgMode .layItem .layItem{animation:none}
.orgMode .layItem>*:not(.layOlho):not(.layAlca):not(.layItem){pointer-events:none}
.orgMode .layItem>.kpis,.orgMode .layItem>.atrasoCards,.orgMode .layItem>.two{pointer-events:auto}
.layArrastando{opacity:.85;cursor:grabbing!important;outline-color:var(--orange)!important;box-shadow:0 14px 34px rgba(10,36,99,.28)!important;z-index:20;animation:none!important}
.layOlho{position:absolute;top:6px;right:6px;width:26px;height:26px;padding:0;display:grid;place-items:center;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted);z-index:3;box-shadow:none}
.layOlho .icon{width:14px;height:14px;margin:0}
.layAlca{position:absolute;top:6px;left:8px;font-size:15px;color:var(--blue-2);z-index:3;line-height:1}
.layBanner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:color-mix(in srgb,var(--orange) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--orange) 45%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.layBanner>.icon{color:var(--orange)}
@keyframes layTreme{from{transform:rotate(-.25deg)}to{transform:rotate(.25deg)}}
.layBanner>div{flex:1 1 320px}

/* ordenação por coluna */
th.ordenavel{cursor:pointer;user-select:none;position:relative}
th.ordenavel:hover{color:var(--blue-2)}
th.ordenavel::after{content:"⇅";margin-left:5px;font-size:10px;opacity:.35}
th.ordAsc::after{content:"▲";opacity:1;color:var(--orange)}th.ordDesc::after{content:"▼";opacity:1;color:var(--orange)}
th.ordAsc,th.ordDesc{color:var(--navy)}body.dark th.ordAsc,body.dark th.ordDesc{color:#fff}

/* reajuste de parcelas */
.rjModal{max-width:1120px!important;width:96vw}
#rjCorpo{display:grid;gap:14px}
.rjSec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.rjSec.off{background:var(--surface-2)}.rjSec.off .rjRow,.rjSec.off .rjSeg{opacity:.45}
.rjSec h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.rjN{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.rjRow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}
.rjRow label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:110px;flex:1 1 110px}
.rjRow input,.rjRow select{height:36px}
.rjConta{font-size:13px;color:var(--muted);padding-bottom:9px}.rjConta b{color:var(--text)}
.rjTres{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px}
@media (max-width:980px){.rjTres{grid-template-columns:1fr}}
.rjSeg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.rjSeg button{border:0;border-radius:0;background:none;box-shadow:none;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);height:auto}
.rjSeg button.on{background:var(--navy);color:#fff}
.rjTg{display:inline-flex;align-items:center;gap:8px;border:0;background:none;box-shadow:none;padding:0;font-weight:700;font-size:14px;color:var(--text);height:auto}
.rjTg i{width:34px;height:20px;border-radius:99px;background:#C9D2E3;position:relative;flex:none}.rjTg i::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.rjTg.on i{background:var(--blue)}.rjTg.on i::after{left:17px}
.rjHint{font-size:12px;color:var(--muted);margin:8px 0 0}.rjHint b{color:var(--text)}.rjAviso{color:#B45309}
.rjTot{display:flex;gap:18px;justify-content:flex-end;font-size:13px;padding:10px 4px 0}.rjTot b{font-size:15px}
.rjHist{border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:13px}.rjHist summary{cursor:pointer;font-weight:600}
.rjConf{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:color-mix(in srgb,var(--orange) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--orange) 45%,transparent);border-radius:12px;padding:12px 14px}.rjConf>.icon{color:var(--orange)}

.rjQuadros{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.rjQuadro{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
.rjQuadro th{background:color-mix(in srgb,var(--blue-2) 12%,var(--surface));color:var(--text);font-weight:700;font-size:13.5px;padding:10px 14px}
.rjQuadro td{padding:10px 14px;background:var(--surface)}
.rjQuadro .rjQT td{font-weight:800}
.rjQuadro tfoot td{font-size:12px;color:var(--muted);background:var(--surface-2);padding:6px 14px}
.rjQuadro tbody tr:hover td{background:var(--surface)!important;box-shadow:none!important}
.rjLista{margin-top:10px;font-size:13px}.rjLista summary{cursor:pointer;font-weight:600;color:var(--blue-2);margin-bottom:8px}
.rjDois{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}@media (max-width:900px){.rjDois{grid-template-columns:1fr}}
.rjEscopo{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);padding:2px 2px}.rjEscopo b{color:var(--text)}.rjEscopo .icon{color:var(--blue-2)}
</style></head>

<script>/* TRAXUP Imobiliário — núcleo: utilidades, armazenamento, autenticação, regras financeiras, boleto BB, conciliação */
'use strict';

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const fmtNum = c => (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const brl = c => 'R$ ' + fmtNum(c || 0);
const toCents = v => { v = String(v ?? '').trim().replace(/[R$\s]/g, ''); if (!v) return 0; if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.'); const n = Math.round(parseFloat(v) * 100); return Number.isFinite(n) ? n : 0; };
const centsIn = c => ((c || 0) / 100).toFixed(2).replace('.', ',');
const hoje = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Recife', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const dataBR = s => s ? s.slice(0, 10).split('-').reverse().join('/') : '—';
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const isoUTC = d => d.toISOString().slice(0, 10);
const diasEntre = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
function addMeses(iso, n) { const [y, m, d] = iso.split('-').map(Number); const t = m - 1 + n; const yy = y + Math.floor(t / 12), mm = ((t % 12) + 12) % 12; const last = new Date(Date.UTC(yy, mm + 1, 0)).getUTCDate(); return `${yy}-${String(mm + 1).padStart(2, '0')}-${String(Math.min(d, last)).padStart(2, '0')}`; }
const addDias = (iso, n) => { const d = parseISO(iso); d.setUTCDate(d.getUTCDate() + n); return isoUTC(d); };
const soma = (arr, f = x => x) => arr.reduce((s, x) => s + (f(x) || 0), 0);
const onlyDigits = s => String(s || '').replace(/\D/g, '');
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const dataExtenso = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return `${d} de ${MESES[m - 1]} de ${y}`; };
const fmtCPF = v => { const d = onlyDigits(v); if (d.length === 11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4'); if (d.length === 14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5'); return v || ''; };

/* valor por extenso (reais) */
function extenso(cents) {
  const u = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
  const dz = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
  const ct = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
  const tri = n => { if (n === 100) return 'cem'; const c = Math.floor(n / 100), r = n % 100, p = []; if (c) p.push(ct[c]); if (r) { if (r < 20) p.push(u[r]); else { p.push(dz[Math.floor(r / 10)] + (r % 10 ? ' e ' + u[r % 10] : '')); } } return p.join(' e '); };
  const num = n => {
    if (n === 0) return 'zero';
    const g = [['', ''], ['mil', 'mil'], ['milhão', 'milhões'], ['bilhão', 'bilhões']]; const parts = []; let i = 0, groups = [];
    while (n > 0) { groups.push(n % 1000); n = Math.floor(n / 1000); }
    for (i = groups.length - 1; i >= 0; i--) { const v = groups[i]; if (!v) continue; let t = i === 1 && v === 1 ? 'mil' : tri(v) + (i ? ' ' + (v === 1 ? g[i][0] : g[i][1]) : ''); parts.push({ t, v, i }); }
    return parts.map((p, k) => { if (k === 0) return p.t; const last = k === parts.length - 1; const join = last && (p.i === 0) && (p.v < 100 || p.v % 100 === 0) ? ' e ' : last && p.i === 0 ? ', ' : ', '; return join + p.t; }).join('').replace(/^, /, '');
  };
  cents = Math.round(cents || 0); const r = Math.floor(cents / 100), c = cents % 100; const out = [];
  if (r) { const t = num(r); const de = (r >= 1e6 && r % 1e6 === 0) ? ' de' : ''; out.push(t + de + (r === 1 ? ' real' : ' reais')); }
  if (c) out.push(num(c) + (c === 1 ? ' centavo' : ' centavos'));
  return out.length ? out.join(' e ') : 'zero real';
}

const Store = {

<script>/* Conversão do backup do sistema Vico (Vico_Banco_Completo_*.sql) para o formato TRAXUP. Usado pelo navegador e por scripts/import-vico.mjs. */
function converterVico(sql, custos = [], nomeArquivo = 'backup.sql') {
  const ITBI_AVALIACAO = 17000000;
/* ---------- leitura do .sql ---------- */
const tables = { records: [], clients: [], advances: [] };
for (const line of String(sql).split(/\r?\n/)) {
  const m = line.match(/^INSERT INTO (\w+) \([^)]*\) VALUES \('((?:[^']|'')*)','((?:[^']|'')*)',(\d+)\);?\s*$/);
  if (!m || !tables[m[1]]) continue;

const lotKey = s => String(s).toUpperCase().replace(/QUADRA|LOTE/g, '').replace(/[^A-Z0-9]/g, '').replace(/^([A-Z]+)0+(\d)/, '$1$2');

const now = new Date().toISOString();

const out = {}; for (const c of ['filiais', 'empreendimentos', 'lotes', 'clientes', 'vendas', 'logs']) out[c] = {};
const put = (c, o) => { out[c][o.id] = o; return o; };

/* ---------- filiais (uma por empresa) e empreendimento ---------- */
const empresas = [...new Set(tables.records.map(r => r.company))].sort();
const filialDe = {}, empDe = {};
for (const e of empresas) {
  const f = put('filiais', { id: 'vico-fil-' + sid(e), nome: e, razao: e, cnpj: '', cidade: 'Petrolina', uf: 'PE', multa: 2, jurosMes: 1, bb: { carteira: '17', variacao: '35' }, origem: 'Vico', atualizadoEm: now });
  const emp = put('empreendimentos', { id: 'vico-emp-' + sid(e), filialId: f.id, nome: 'Vico Home Resort — ' + e, cidade: 'Petrolina', origem: 'Vico', atualizadoEm: now });

/* ---------- clientes ---------- */
const F = { name: 'nome', cpf: 'cpf', rg: 'rg', nationality: 'nacionalidade', civilStatus: 'estadoCivil', profession: 'profissao', spouseName: 'conjuge', phone: 'telefone', whatsapp: 'whatsapp', email: 'email', street: 'logradouro', number: 'numero', complement: 'complemento', neighborhood: 'bairro', city: 'cidade', state: 'uf', zip: 'cep' };

  const primeiro = parcelas.map(p => p.venc).filter(Boolean).sort()[0] || '';

  historico.push({ data: now, usuario: 'Importação', acao: `Importado do Vico: ${parcelas.length} parcelas, ${parcelas.reduce((s, p) => s + p.pagamentos.length, 0)} pagamentos` });
  const comissoesPagas = (r.commissions || []).map(q => ({ valor: q.amount, data: q.date, obs: (q.note || '') + (q.relatedClient ? ' · ' + q.relatedClient : '') })); nCom += comissoesPagas.length;

  const adv = antecip[r.company + '|' + norm(r.client)] || [];
  put('vendas', {
    id: 'vico-vd-' + sid(r.id), filialId: filialDe[r.company], numero: `${r.company.toUpperCase()}-${r.lot}`, loteId: lote.id, clienteId, data: entrada || primeiro, valor: r.price,
    corretor: 'Metro Quadrado', comissaoPct: 4, ...(r.commissionAmount !== undefined || relacionadas ? { comissaoValor: comBase + relacionadas } : {}), ...(r.commissionExcluded ? { comissaoExcluida: true } : {}), ...(r.commissionSuspended ? { comissaoSuspensa: true } : {}), ...(r.commissionSchedule ? { comissaoParcelamento: r.commissionSchedule } : {}),
    comissoesPagas, indice: 'IPCA', reajuste: 'IPCA + 7% a.a., conforme a vigência de cada período contratual', status: 'Ativo',
    classificacao: r.debtClassification === 'Inadimplente' ? 'Inadimplente' : r.debtClassification === 'Em atraso' ? 'Em atraso' : 'Automático',
    ...(r.saleTotals ? { totaisContrato: r.saleTotals } : {}), ...(adv.length ? { antecipacoes: adv.map(a => ({ tipo: a.type, ref: a.reference, venc: a.due, pagoEm: a.paidDate, valor: a.total })) } : {}),
    parcelas, historico, origem: 'Vico', vicoId: r.id, atualizadoEm: now

put('logs', { id: 'importacao-vico', itens: [{ data: now, usuario: 'Importação', acao: `Backup Vico ${nomeArquivo}: ${tables.records.length} lotes, ${Object.keys(out.vendas).length} vendas, ${nParc} parcelas, ${nPag} pagamentos, ${nCom} comissões` }], atualizadoEm: now });

  return new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = () => rej(Error('Falha ao ler a imagem.')); fr.onload = () => { const im = new Image(); im.onerror = () => rej(Error('Imagem inválida.')); im.onload = () => { let w = im.width, h = im.height, maxW = 1500; let out = ''; for (let q = 0.75; q > 0.25; q -= 0.1) { const sc = Math.min(1, maxW / w); const c = document.createElement('canvas'); c.width = Math.round(w * sc); c.height = Math.round(h * sc); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); out = c.toDataURL('image/jpeg', q); if (out.length < 235000) return res(out); maxW = Math.round(maxW * 0.85); } rej(Error('A imagem da planta é grande demais. Use uma imagem menor.')); }; im.src = fr.result; }; fr.readAsDataURL(file); });

const PAPEL_CONJUGE = /c[oô]njuge|companheir/i;

  const ver = Store.list('clientes').length + ':' + (Store.list('clientes').reduce((m, c) => c.atualizadoEm > m ? c.atualizadoEm : m, ''));
  if (_titCache.ver !== ver) { _titCache.ver = ver; _titCache.map = new Map(); }
  if (_titCache.map.has(o.id)) return Store.get('clientes', _titCache.map.get(o.id));
  const ks = new Set((o.vinculosVico || []).map(l => l.contrato || l.empresa + '-' + l.lote)); const sob = new Set(norm(o.nome).split(' ').filter(t => t.length > 3));
  let best = null, bs = 0;
  for (const c of Store.list('clientes')) {

    const sc = comum * 100 + norm(c.nome).split(' ').filter(t => sob.has(t)).length * 10 + (tv.some(l => /principal/i.test(l.papel || '') && ks.has(l.contrato)) ? 1 : 0) + (norm(c.conjuge || '') === norm(o.nome) ? 1000 : 0);
    if (sc > bs) { bs = sc; best = c; }

  _titCache.map.set(o.id, best?.id); return best;
}

const CAMPOS_CLIENTE = [['nome', 'Nome completo / razão social', 'c2', true], ['cpf', 'CPF / CNPJ'], ['rg', 'RG / órgão / UF'], ['nacionalidade', 'Nacionalidade'], ['estadoCivil', 'Estado civil'], ['profissao', 'Profissão'], ['conjuge', 'Cônjuge / companheiro(a)'], ['telefone', 'Telefone'], ['whatsapp', 'WhatsApp'], ['email', 'E-mail', 'c2'], ['cep', 'CEP'], ['logradouro', 'Logradouro', 'c2'], ['numero', 'Número'], ['complemento', 'Complemento'], ['bairro', 'Bairro'], ['cidade', 'Cidade'], ['uf', 'UF']];

  const resumo = e ? { cred: soma(e.transacoes.filter(t => t.valor > 0), t => t.valor), conc: soma(e.transacoes.filter(t => t.status === 'conciliado'), t => t.valor), pend: e.transacoes.filter(t => (t.status || 'pendente') === 'pendente' && t.valor > 0).length } : null;

  ${e ? `<div class="kpis" style="grid-template-columns:repeat(4,1fr)"><div class="kpi bl"><span>Créditos no extrato</span><strong>${brl(resumo.cred)}</strong></div><div class="kpi bl"><span>Conciliado</span><strong class="green">${brl(resumo.conc)}</strong></div><div class="kpi hl"><span>Créditos pendentes</span><strong>${resumo.pend}</strong></div><div class="kpi"><span>Conta</span><strong style="font-size:16px">${esc(e.banco || '')} ${esc(e.conta || '')}</strong><small>${esc(e.arquivo)}</small></div></div>

function partesDiscord(t) { const out = []; let s = String(t); while (s.length > 1990) { let cut = s.lastIndexOf('\n', 1990); if (cut < 1000) cut = 1990; out.push(s.slice(0, cut)); s = s.slice(cut).replace(/^\n/, ''); } if (s.trim()) out.push(s); return out; }
async function enviarDiscord(texto, hookIds) {
  const hooks = hookIds.map(id => Store.get('webhooks', id)).filter(Boolean); if (!hooks.length) throw Error('Selecione pelo menos um canal.'); if (!texto.trim()) throw Error('A mensagem está vazia.');
  const logDoc = Store.get('logs', 'discord') || { id: 'discord', itens: [] }; let ok = 0;
  for (const h of hooks) {
    let erro = ''; try { for (const parte of partesDiscord(texto)) { const r = await fetch('api/discord', { method: 'POST', headers: { 'Content-Type': 'application/json', ...Store.authH() }, body: JSON.stringify({ webhookId: h.id, content: parte }) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw Error(j.error || 'Falha no envio'); } ok++; } catch (e) { erro = e.message; }
    logDoc.itens = [{ data: new Date().toISOString(), canal: h.nome, filialId: h.filialId, texto, ok: !erro, erro, usuario: S.user.nome }, ...(logDoc.itens || [])].slice(0, 150);
  }
  await Store.put('logs', logDoc); return { ok, total: hooks.length };
}

async function restaurarArquivo(f) {
  const txt = await f.text(); let dados, titulo;
  if (/\.sql$/i.test(f.name) || /^\s*--\s*Vico/i.test(txt.slice(0, 200)) || /INSERT INTO records/.test(txt.slice(0, 5000))) {
    const r = converterVico(txt, [], f.name); dados = r.dados; const x = r.resumo;
    titulo = `Backup do <b>Vico</b> reconhecido: ${x.filiais} empresas (viram filiais), ${x.lotes} lotes, ${x.vendas} vendas, ${x.clientes} clientes, ${x.parcelas.toLocaleString('pt-BR')} parcelas, ${x.pagamentos} pagamentos e ${x.comissoes} comissões pagas.<br><br>Importar agora? Registros já importados antes são atualizados, sem duplicar.`;
  } else {
    let j; try { j = JSON.parse(txt); } catch (e) { throw Error('Arquivo inválido. Use o backup do TRAXUP (.json) ou do Vico (.sql).'); }
    dados = {}; for (const c of COLS) dados[c] = j[c] || {}; const n = COLS.reduce((t, c) => t + Object.keys(dados[c]).length, 0);
    if (!n) throw Error('O arquivo não tem registros do TRAXUP.');
    titulo = `Restaurar <b>${n}</b> registros deste backup? Registros com o mesmo código são substituídos.`;
  }
  confirmar(titulo, async () => {
    const itens = COLS.flatMap(c => Object.values(dados[c] || {}).filter(o => !(c === 'usuarios' && Store.mode === 'server' && !o.hash)).map(o => [c, o]));
    modal(`${mHead('Importação', 'Gravando registros…')}<div class="modalBody"><div class="meter"><i id="impBar" style="width:0%"></i></div><p class="hint" id="impTxt" style="margin-top:10px">0 de ${itens.length}</p></div>`, 'narrow');
    let n = 0; for (const [c, o] of itens) { await Store.put(c, o); n++; if (n % 10 === 0 || n === itens.length) { const b = $('#impBar'), t = $('#impTxt'); if (b) b.style.width = (n / itens.length * 100) + '%'; if (t) t.textContent = `${n} de ${itens.length}`; } }
    closeModal(); await audit(`Importou backup ${f.name} (${n} registros)`); toast(n + ' registros importados.'); S.filial = '*'; render();
  }, 'Importar');
}

async function importarTextoExtrato(txt, nome, filialId) {
  const r = /<OFX>|<STMTTRN>/i.test(txt) ? parseOFX(txt) : parseCSVExtrato(txt);
  const ja = new Set(Store.list('extratos').flatMap(e => e.transacoes.map(t => t.fitid)));
  const novos = r.transacoes.filter(t => !ja.has(t.fitid)).map(t => ({ ...t, status: 'pendente' }));
  if (!r.transacoes.length) throw Error('Nenhum lançamento encontrado no arquivo.');
  if (!novos.length) throw Error('Todos os lançamentos deste arquivo já foram importados.');
  const e = await Store.put('extratos', { filialId, arquivo: nome, banco: r.banco === '001' ? 'Banco do Brasil' : r.banco, conta: r.conta, importadoEm: new Date().toISOString(), importadoPor: S.user.nome, transacoes: novos });
  S.f.ext = e.id; S.f.cst = 'pendente'; toast(`${novos.length} lançamento(s) importado(s)${r.transacoes.length > novos.length ? `, ${r.transacoes.length - novos.length} já existiam` : ''}.`); renderView();
}

  ${enviado ? `<div class="notice info">Recebemos o seu contrato assinado em ${new Date(a.enviadoEm).toLocaleString('pt-BR')}. A empresa vai conferir e avisar por aqui.</div>` : `<div class="asPassos" style="margin:0">
  ${passo(1, false, 'Baixe o contrato em PDF', 'Clique no botão e, na janela de impressão, escolha <b>Salvar como PDF</b>.', mod ? `<button class="sm" data-act="ptPdfAssinar" data-id="${v.id}">${ic('down')}Baixar contrato em PDF</button>` : '')}
  ${passo(2, false, 'Assine no gov.br', 'Entre em <b>assinador.iti.br</b> com sua conta gov.br (nível prata ou ouro), envie o PDF, posicione a assinatura e confirme pelo app gov.br. Se o contrato tiver cônjuge, ele também assina o mesmo arquivo.', `<a class="sm btnLink" href="https://assinador.iti.br" target="_blank" rel="noopener">${ic('key')}Abrir assinador gov.br</a>`)}
  ${passo(3, false, 'Envie o PDF assinado', 'Envie aqui o arquivo que o gov.br devolveu (termina em .pdf).', `<label class="sm asUp" style="background:var(--blue);color:#fff;border-color:var(--blue)">${ic('upload')}Enviar contrato assinado<input type="file" accept="application/pdf,.pdf" data-pt-anexo="${v.id}" hidden></label>`)}
  </div>`}</div></div>`;
}

function portalExtrato() {
  const v = Store.get('vendas', PORTAL.venda), c = PORTAL.cliente || {}; if (!v) return;
  const ps = (v.parcelas || []).slice().sort((a, b) => a.venc.localeCompare(b.venc)); const e = pEmp(v), fil = Store.get('filiais', v.filialId) || {}, bb = cfgBoleto(fil);
  const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Extrato ${esc(v.numero)}</title><style>body{font-family:Inter,Arial,sans-serif;color:#0A1A3A;margin:28px;font-size:12px}h1{font-size:20px;margin:0}h2{font-size:13px;margin:18px 0 6px}.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1B4DCC;padding-bottom:10px}.top small{color:#5A6B8C}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.g div{border:1px solid #D8E0EE;border-radius:8px;padding:8px}.g span{display:block;color:#5A6B8C;font-size:10.5px}.g b{font-size:14px}table{width:100%;border-collapse:collapse;margin-top:6px}th,td{border-bottom:1px solid #E3E8F2;padding:5px 6px;text-align:left}th{background:#F2F5FB;font-size:10.5px;text-transform:uppercase;color:#5A6B8C}.n{text-align:right;white-space:nowrap}tfoot td{font-weight:700;border-top:2px solid #1B4DCC}.foot{margin-top:18px;color:#5A6B8C;font-size:10px}</style></head><body>
  <div class="top"><div><small>${esc(bb.razao || fil.nome || '')}${bb.cnpj ? ' · CNPJ ' + esc(fmtCPF(bb.cnpj)) : ''}</small><h1>Extrato do contrato ${esc(v.numero)}</h1></div><small>Emitido em ${dataBR(hoje())}</small></div>
  <h2>Comprador</h2>${esc(c.nome || '')}${c.cpf ? ' · CPF ' + esc(fmtCPF(c.cpf)) : ''}
  <h2>Imóvel</h2>${esc(e.nome || '')} · ${esc(pNomeLote(v))} · contrato de ${dataBR(v.data)}
  <div class="g"><div><span>Valor do contrato</span><b>${brl(v.valor)}</b></div><div><span>Total pago</span><b>${brl(soma(ps, pagoParcela))}</b></div><div><span>Saldo a pagar</span><b>${brl(soma(ps, saldoParcela))}</b></div><div><span>Em atraso</span><b>${brl(soma(ps.filter(p => vencida(p)), saldoParcela))}</b></div></div>
  <h2>Parcelas</h2><table><thead><tr><th>Parcela</th><th>Vencimento</th><th class="n">Valor</th><th class="n">Pago</th><th>Pago em</th><th class="n">Saldo</th><th>Situação</th></tr></thead><tbody>${ps.map(p => `<tr><td>${esc(p.tipo)} ${esc(p.ref)}</td><td>${dataBR(p.venc)}</td><td class="n">${brl(totalParcela(p))}</td><td class="n">${brl(pagoParcela(p))}</td><td>${(p.pagamentos || []).map(x => dataBR(x.data)).join(', ') || '—'}</td><td class="n">${brl(saldoParcela(p))}</td><td>${esc(statusParcela(p))}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td colspan="2">${ps.length} parcelas</td><td class="n">${brl(soma(ps, totalParcela))}</td><td class="n">${brl(soma(ps, pagoParcela))}</td><td></td><td class="n">${brl(soma(ps, saldoParcela))}</td><td></td></tr></tfoot></table>
  <p class="foot">Documento informativo gerado pelo Painel do cliente TRAXUP. Valores de parcelas vencidas podem receber multa e juros no pagamento.</p></body></html>`;
  imprimirHTML(html, `extrato_${v.numero}.html`);
}
function imprimirHTML(html, nome) { const w = window.open('', '_blank'); if (w) { w.document.write(html + '<script>setTimeout(()=>print(),400)<\/script>'); w.document.close(); } else salvarArquivo(nome, html, 'text/html'); }

function portalContrato(vid) {
  const v = Store.get('vendas', vid), m = pModeloDa(v); if (!m) return toast('Contrato ainda não disponibilizado.', true);
  const corpo = docContrato(v, m).corpo.replace(/<span style="background:#FFF3D6">(.*?)<\/span>/g, '$1');
  modal(`${mHead('Contrato ' + v.numero, m.nome)}<div class="modalBody"><div class="docPreview">${corpo}</div><div class="formActions"><span class="muted">Documento somente para consulta.</span><span class="spacer"></span><button type="button" data-act="closeModal">Fechar</button><button class="primary" data-act="ptImprimirContrato" data-id="${v.id}">${ic('down')}Imprimir / salvar PDF</button></div></div>`, 'wide');
}

Object.assign(ACT, {
  ptSair: () => portalSair(),
  ptAssinar: el => { const v = Store.get('vendas', el.dataset.id); modal(`${mHead('Assinatura do contrato ' + v.numero, 'Assine pelo gov.br')}<div class="modalBody">${cardAssinaturaPortal(v).replace(/^<div class="card ptAss"[^>]*>/, '<div class="ptAss">')}</div>`, 'wide'); },
  ptPdfAssinar: el => { const v = Store.get('vendas', el.dataset.id), m = pModeloDa(v); if (m) imprimirContratoPdf(v, m); },
  ptVerAssinado: el => abrirPdfAssinado('/api/portal/contrato/' + encodeURIComponent(el.dataset.id) + '/pdf', { Authorization: 'Bearer ' + PORTAL.token }),
  ptMercado: () => modal(`${mHead('Mercado e índices', 'Câmbio, bolsa e índices de reajuste')}<div class="modalBody">${cardMercado().replace('id="mercadoCard"', '').replace(/<button class="sm" data-act="mercadoAtualizar"[^]*?<\/button>/, '')}<p class="hint">Índices: Banco Central do Brasil. Valores informativos; o reajuste da sua parcela segue o índice e as regras do seu contrato.</p></div>`, 'wide'),
  ptMercadoTela: () => { lembrar('traxup_pt_mercado', '1', lembrado('traxup_pt_mercado') !== '1'); const box = $('#mercadoCard'); if (box) box.outerHTML = cardMercadoResumo(); },
  ptVoltarLogin: () => portalLogin(),
  ptVenda: el => { PORTAL.venda = el.dataset.id; portalRender(); },
  ptAba: el => { PORTAL.aba = el.dataset.k; PORTAL.mais = false; portalRender(); },
  ptMais: () => { PORTAL.mais = !PORTAL.mais; portalRender(); },
  ptExtrato: () => portalExtrato(),
  ptContrato: el => portalContrato(el.dataset.id),
  ptImprimirContrato: el => { const v = Store.get('vendas', el.dataset.id), m = pModeloDa(v); const { doc } = docContrato(v, m); imprimirHTML(doc.replace(/<span style="background:yellow">(.*?)<\/span>/g, '$1'), `contrato_${v.numero}.html`); },
  ptBoleto: el => { const b = Store.get('boletos', el.dataset.id); modal(`${mHead('2ª via do boleto', 'Vencimento ' + dataBR(b.venc) + ' · ' + brl(b.valor))}<div class="modalBody"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap"><code class="k" style="font-size:14px;padding:6px 10px">${esc(b.linha)}</code><button class="sm" data-act="copyTxt" data-t="${esc(onlyDigits(b.linha))}">${ic('copy')}Copiar linha digitável</button><span class="spacer"></span><button class="sm primary" data-act="ptImprimirBoleto" data-id="${b.id}">${ic('down')}Imprimir boleto</button></div><div style="border:1px solid var(--line);border-radius:10px;padding:16px;overflow:auto">${htmlBoleto(b)}</div></div>`, 'wide'); },
  ptImprimirBoleto: el => imprimirHTML(docBoleto(Store.get('boletos', el.dataset.id)), 'boleto.html'),
  ptSolicitar: el => { const v = Store.get('vendas', el.dataset.v), p = v.parcelas.find(x => x.id === el.dataset.p); modal(`${mHead('Solicitar boleto', p.tipo + ' ' + p.ref + ' · vence ' + dataBR(p.venc))}<form class="modalBody" data-form="ptSolicitar" data-v="${v.id}" data-p="${p.id}"><p>A empresa vai emitir o boleto desta parcela de <b>${brl(saldoParcela(p))}</b> e ele aparecerá aqui no painel para você imprimir.</p><label>Observação (opcional)<textarea name="obs" rows="3" maxlength="500" placeholder="Ex.: prefiro pagar no dia 20"></textarea></label><div class="formActions"><button type="button" data-act="closeModal">Cancelar</button><button class="primary">Enviar solicitação</button></div></form>`, 'narrow'); },
  ptSenha: () => modal(`${mHead('Segurança', 'Alterar senha')}<form class="modalBody" data-form="ptSenha"><label>Senha atual<input name="atual" type="password" required autocomplete="current-password"></label><label>Nova senha (mín. 6)<input name="nova" type="password" minlength="6" required autocomplete="new-password"></label><label>Repita a nova senha<input name="nova2" type="password" minlength="6" required autocomplete="new-password"></label><div class="formActions"><button type="button" data-act="closeModal">Cancelar</button><button class="primary">Salvar</button></div></form>`, 'narrow'),
});
Object.assign(FORMS, {
  async portalLogin(v) {
    try { const j = await portalApi('login', { method: 'POST', body: JSON.stringify({ email: v.email, senha: v.senha, codigo: v.codigo || '' }) }); lembrar('traxup_portal_email', v.email, !!v.lembrar); lembrarCodigo(v); PORTAL.token = j.token; try { sessionStorage.setItem('traxup_portal', JSON.stringify({ token: j.token })); } catch (e) { } await portalCarregar(); portalRender(); if (j.trocarSenha) { ACT.ptSenha(); toast('Primeiro acesso: crie uma senha só sua.'); } }
    catch (e) { portalLogin(e.message); }
  },
  async ptSolicitar(v, f) { const j = await portalApi('solicitar', { method: 'POST', body: JSON.stringify({ vendaId: f.dataset.v, parcelaId: f.dataset.p, tipo: 'boleto', obs: v.obs }) }); closeModal(); toast(j.repetida ? 'Você já tinha solicitado este boleto. Aguarde a empresa.' : 'Solicitação enviada. Assim que o boleto for emitido, ele aparece aqui.'); await portalCarregar(); portalRender(); },
  async ptSenha(v) { if (v.nova !== v.nova2) throw Error('As senhas novas não conferem.'); await portalApi('senha', { method: 'POST', body: JSON.stringify({ atual: v.atual, nova: v.nova }) }); closeModal(); toast('Senha alterada.'); },
});

(ehPortal() ? portalBoot : boot)();
</script>
</body></html>
